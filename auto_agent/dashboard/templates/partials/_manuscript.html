<!-- Manuscript 탭 — 챕터 + 원고 본문 -->
{% if chapters %}
<div class="chapter-filter">
  <button class="btn btn-accent chapter-btn active" onclick="filterChapter(0, this)">All</button>
  {% for ch in chapters %}
  <button class="btn chapter-btn" onclick="filterChapter({{ ch.number }}, this)">Ch{{ ch.number }}</button>
  {% endfor %}
</div>

<div class="manuscript-reading">
  {% for ch in chapters %}
  <div class="ms-chapter" data-chapter="{{ ch.number }}">
    <h2 class="ms-chapter-title">Ch{{ ch.number }}. {{ ch.title }}</h2>
    <div class="ms-body">
      {% for scene in ch.scenes %}
      {% for line in scene.lines %}
      <p>{{ line }}</p>
      {% endfor %}
      {% endfor %}
    </div>
  </div>
  {% endfor %}
</div>

<script>
function filterChapter(num, btn) {
  document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.ms-chapter').forEach(ch => {
    ch.style.display = (num === 0 || ch.dataset.chapter == num) ? '' : 'none';
  });
}
</script>
{% else %}
<div class="empty">No manuscript found. Run the pipeline first.</div>
{% endif %}

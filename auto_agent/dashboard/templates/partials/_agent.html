<!-- Agent Messenger — 에이전트 간 실시간 메시지 -->
<div class="agent-page">
  <div class="agent-header">
    <h2>Agent Messenger</h2>
    <div class="agent-controls">
      <span id="agent-status" class="agent-badge offline">연결 중...</span>
      <button class="btn-sm btn-outline" onclick="clearMessages()">지우기</button>
    </div>
  </div>

  <div id="agent-messages" class="agent-messages">
    <div class="agent-empty">에이전트 메시지가 여기에 표시됩니다.</div>
  </div>
</div>

<style>
.agent-page { padding: 16px 20px; height: calc(90vh - 100px); display: flex; flex-direction: column; }
.agent-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.agent-header h2 { margin: 0; font-size: 16px; }
.agent-controls { display: flex; gap: 8px; align-items: center; }

.agent-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; }
.agent-badge.online { background: rgba(34,197,94,0.15); color: #22C55E; }
.agent-badge.offline { background: rgba(239,68,68,0.15); color: #EF4444; }

.agent-messages {
  flex: 1; overflow-y: auto; padding: 8px;
  background: rgba(0,0,0,0.2); border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.06);
  display: flex; flex-direction: column; gap: 6px;
}
.agent-empty { color: var(--text-muted); text-align: center; padding: 40px; font-size: 12px; }

.msg-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; border-radius: 6px; animation: msgIn 0.3s ease; }
.msg-row:hover { background: rgba(255,255,255,0.02); }

@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
}
.msg-avatar.director { background: #3B82F6; color: #fff; }
.msg-avatar.researcher { background: #10B981; color: #fff; }
.msg-avatar.writer { background: #F59E0B; color: #000; }
.msg-avatar.reviewer { background: #8B5CF6; color: #fff; }
.msg-avatar.system { background: #6B7280; color: #fff; }

.msg-body { flex: 1; min-width: 0; }
.msg-agent { font-size: 11px; font-weight: 600; margin-bottom: 1px; }
.msg-agent .msg-phase { font-weight: 400; color: var(--text-muted); margin-left: 6px; font-size: 10px; }
.msg-text { font-size: 12px; color: #D4D4D8; line-height: 1.5; word-break: break-word; }
.msg-time { font-size: 9px; color: rgba(255,255,255,0.25); flex-shrink: 0; margin-top: 4px; }

.msg-row.level-success .msg-text { color: #22C55E; }
.msg-row.level-error .msg-text { color: #EF4444; }
.msg-row.level-warning .msg-text { color: #F59E0B; }
</style>

<script>
(function() {
  var container = document.getElementById('agent-messages');
  var statusEl = document.getElementById('agent-status');
  var es = null;
  var msgCount = 0;

  function connect() {
    es = new EventSource('/api/agent-messages/stream');

    es.onopen = function() {
      statusEl.textContent = '연결됨';
      statusEl.className = 'agent-badge online';
    };

    es.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        addMessage(msg);
      } catch(err) {}
    };

    es.onerror = function() {
      statusEl.textContent = '재연결 중...';
      statusEl.className = 'agent-badge offline';
      es.close();
      setTimeout(connect, 3000);
    };
  }

  function addMessage(msg) {
    // 빈 상태 메시지 제거
    var empty = container.querySelector('.agent-empty');
    if (empty) empty.remove();

    msgCount++;
    var role = getRole(msg.agent);
    var initials = getInitials(msg.agent);
    var timeStr = new Date(msg.timestamp * 1000).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

    var row = document.createElement('div');
    row.className = 'msg-row level-' + (msg.level || 'info');
    row.innerHTML = ''
      + '<div class="msg-avatar ' + role + '">' + initials + '</div>'
      + '<div class="msg-body">'
      + '  <div class="msg-agent">' + esc(msg.agent)
      + (msg.phase ? '<span class="msg-phase">' + esc(msg.phase) + '</span>' : '')
      + '  </div>'
      + '  <div class="msg-text">' + esc(msg.text) + '</div>'
      + '</div>'
      + '<div class="msg-time">' + timeStr + '</div>';

    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  function getRole(agent) {
    var a = agent.toLowerCase();
    if (a.indexOf('director') >= 0) return 'director';
    if (a.indexOf('research') >= 0) return 'researcher';
    if (a.indexOf('writer') >= 0 || a.indexOf('작가') >= 0) return 'writer';
    if (a.indexOf('review') >= 0) return 'reviewer';
    return 'system';
  }

  function getInitials(agent) {
    if (!agent) return '?';
    var parts = agent.split(/[-_\s]/);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return agent.substring(0, 2).toUpperCase();
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  window.clearMessages = function() {
    container.innerHTML = '<div class="agent-empty">에이전트 메시지가 여기에 표시됩니다.</div>';
    msgCount = 0;
  };

  // 히스토리 로드
  fetch('/api/agent-messages/history?limit=100')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      (data.messages || []).forEach(addMessage);
    })
    .catch(function() {});

  // SSE 연결
  connect();
})();
</script>

<!-- Pipeline 탭 — Energy theme, 가로 타임라인 레이아웃 -->
<!-- SSE: /api/p/{slug}/pipeline/events | /api/p/{slug}/pipeline/stream -->

<div id="pipeline-stream-root" style="display:flex;flex-direction:column;height:100%;min-height:0;gap:0;">

  <!-- ── 1. 가로 타임라인 ── -->
  <div id="step-timeline">
    <!-- Stage 1 -->
    <div class="tl-phase">
      <div class="tl-phase-label">S1</div>
      <div class="tl-step-node" id="sc-step_0"   data-step="step_0"            title="Preflight">✓</div>
      <div class="tl-step-node" id="sc-step_1a"  data-step="step_1a"           title="Skeleton">1a</div>
      <div class="tl-step-node" id="sc-step_1b"  data-step="step_1b"           title="Flesh">1b</div>
    </div>
    <div class="tl-arrow">→</div>
    <!-- Stage 2 -->
    <div class="tl-phase">
      <div class="tl-phase-label">S2</div>
      <div class="tl-step-node" id="sc-step_2_draft"       data-step="step_2_draft"       title="Draft">2d</div>
      <div class="tl-step-node" id="sc-step_2_target"      data-step="step_2_target"      title="Target">2t</div>
      <div class="tl-step-node" id="sc-step_2_manuscript"  data-step="step_2_manuscript"  title="원고">2m</div>
      <div class="tl-step-node" id="sc-step_2"             data-step="step_2"             title="씬분할">2</div>
      <div class="tl-step-node" id="sc-step_2_consistency" data-step="step_2_consistency" title="보정">2c</div>
      <div class="tl-step-node" id="sc-step_2_review"      data-step="step_2_review"      title="래칫">⚙</div>
      <div class="tl-step-node" id="sc-step_2_data"        data-step="step_2_data"        title="Data">2D</div>
      <div class="tl-step-node" id="sc-step_2b"            data-step="step_2b"            title="Fact">2b</div>
    </div>
    <div class="tl-arrow">→</div>
    <!-- Stage 3 -->
    <div class="tl-phase">
      <div class="tl-phase-label">S3</div>
      <div class="tl-step-node" id="sc-step_3b" data-step="step_3b" title="Assembly">3b</div>
      <div class="tl-step-node" id="sc-step_3c" data-step="step_3c" title="Upload">3c</div>
    </div>
    <!-- 상태 -->
    <div id="tl-status-bar">
      <span id="stream-status-dot" style="color:var(--energy-ink-low)">●</span>
      <span id="stream-step-label" style="font-weight:600;font-size:12px;">대기 중</span>
      <span id="stream-elapsed" style="color:var(--energy-ink-low);font-size:11px;">—</span>
    </div>
  </div>

  <!-- ── 2. 스켈레톤 바 ── -->
  <div id="skeleton-bar" style="display:none;">
    <div id="skeleton-bar-inner"></div>
  </div>

  <!-- ── 3. 뷰 전환 탭 ── -->
  <div id="pipeline-ctrl-bar">
    <div class="pctrl-tabs">
      <button class="pctrl-tab active" onclick="setContentView('split', this)">리서치 + 원고</button>
      <button class="pctrl-tab" onclick="setContentView('scenes', this)">🎬 씬스펙</button>
    </div>
    <span id="stream-chars" style="display:none;font-size:11px;color:var(--energy-ink-low);margin-left:auto;"></span>
  </div>

  <!-- ── 3. 3분할 캔버스 ── -->
  <div id="split-view" style="flex:1;min-height:0;overflow:hidden;">
    <div class="rc-wrap" id="rc-wrap" data-slug="{{ slug }}">
      <div class="rc-panels">

        <!-- 왼쪽: Research Canvas -->
        <div class="rc-panel rc-panel-research" id="rc-research-panel">
          <div class="rc-panel-header">
            <span class="rc-panel-title">Research Canvas</span>
            <span class="rc-claim-count" id="rc-claim-count">— claims</span>
            <span class="rc-live-dot" id="rc-live-dot" title="실시간 스트리밍"></span>
          </div>
          <div class="rc-panel-body" id="rc-claims-body">
            <div class="rc-empty">리서치 데이터를 불러오는 중...</div>
          </div>
        </div>

        <!-- 중앙: Manuscript Canvas (순수 원고 본문만) -->
        <div class="rc-panel rc-panel-manuscript" id="rc-manuscript-panel">
          <div class="rc-panel-header">
            <span class="rc-panel-title">Manuscript Canvas</span>
            <span class="rc-ms-badge" id="rc-ms-badge">—</span>
          </div>
          <div class="rc-panel-body" id="rc-ms-body">
            <div class="rc-empty">원고가 생성되면 여기에 표시됩니다.</div>
          </div>
        </div>

        <!-- 오른쪽: Agent Status Panel -->
        <div class="rc-panel rc-panel-status" id="rc-status-panel">
          <div class="rc-panel-header">
            <span class="rc-panel-title">Agent Status</span>
            <span class="rc-status-badge" id="rc-status-badge">대기</span>
          </div>
          <div class="rc-panel-body" id="rc-status-body">
            <div class="rc-empty">에이전트 진행 상황이 여기에 표시됩니다.</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ── 4b. 씬스펙 뷰 (탭 전환) ── -->
  <div id="panel-scenes" class="scene-stream-list" style="display:none;flex:1;min-height:0;overflow-y:auto;">
    <div style="color:var(--energy-ink-low);font-family:sans-serif;font-size:13px;padding:16px;">
      씬이 생성되면 여기에 표시됩니다.
    </div>
  </div>

  <!-- ── 5. 이벤트 로그 (하단 고정) ── -->
  <div id="panel-events" class="event-log" style="max-height:180px;border-top:1px solid var(--energy-bg-card);">
    <div class="event-row">
      <span class="event-ts">—</span>
      <span class="event-type info">대기</span>
      <span class="event-body">파이프라인 시작을 기다리는 중...</span>
    </div>
  </div>

</div>

<style>
/* ── 타임라인 ── */
#step-timeline {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--energy-bg-card);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-wrap: wrap;
  flex-shrink: 0;
}
.tl-phase {
  display: flex;
  align-items: center;
  gap: 4px;
}
.tl-phase-label {
  font-size: 9px;
  font-weight: 700;
  color: var(--energy-ink-low);
  letter-spacing: 0.05em;
  padding: 0 4px;
  text-transform: uppercase;
}
.tl-arrow {
  color: var(--energy-ink-low);
  font-size: 12px;
  padding: 0 2px;
}
.tl-step-node {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  font-family: monospace;
  cursor: default;
  background: rgba(255,255,255,0.05);
  color: var(--energy-ink-low);
  border: 1px solid rgba(255,255,255,0.08);
  transition: all 0.2s;
  position: relative;
}
.tl-step-node:hover::after {
  content: attr(title);
  position: absolute;
  top: 32px;
  left: 50%;
  transform: translateX(-50%);
  background: #111;
  color: #eee;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
}
.tl-step-node.completed {
  background: rgba(20,240,180,0.15);
  color: var(--energy-mint);
  border-color: var(--energy-mint);
}
.tl-step-node.running {
  background: rgba(0,220,255,0.15);
  color: var(--energy-cyan);
  border-color: var(--energy-cyan);
  animation: pulse-dot 1.5s ease infinite;
}
.tl-step-node.failed {
  background: rgba(255,80,80,0.15);
  color: #ff5050;
  border-color: #ff5050;
}
.tl-step-node.skipped {
  opacity: 0.4;
}
#tl-status-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  padding-left: 12px;
}

/* ── 스켈레톤 바 ── */
#skeleton-bar {
  padding: 8px 16px;
  background: rgba(245,158,11,0.04);
  border-bottom: 1px solid rgba(245,158,11,0.12);
  flex-shrink: 0;
  overflow-x: auto;
}
#skeleton-bar-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  min-height: 24px;
}
.sk-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: rgba(245,158,11,0.6);
  margin-right: 4px;
  flex-shrink: 0;
}
.sk-section {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
}
.sk-section + .sk-section::before {
  content: '·';
  color: rgba(255,255,255,0.15);
  margin: 0 2px;
}
.sk-chip {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(255,255,255,0.06);
  color: #A1A1AA;
  white-space: nowrap;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sk-fig {
  background: rgba(139,92,246,0.12);
  color: #C4B5FD;
}
.sk-timeline {
  gap: 6px;
}
.sk-tl-item {
  font-size: 11px;
  color: #A1A1AA;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.sk-yr {
  font-size: 10px;
  font-weight: 700;
  color: rgba(245,158,11,0.7);
  background: rgba(245,158,11,0.08);
  padding: 1px 5px;
  border-radius: 4px;
}

/* ── 컨트롤 바 ── */
#pipeline-ctrl-bar {
  display: flex;
  align-items: center;
  padding: 6px 16px;
  gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.pctrl-tabs {
  display: flex;
  gap: 4px;
}
.pctrl-tab {
  padding: 4px 12px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent;
  color: var(--energy-ink-low);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.pctrl-tab:hover { background: rgba(255,255,255,0.06); color: var(--energy-ink-mid); }
.pctrl-tab.active {
  background: rgba(0,220,255,0.15);
  color: var(--energy-cyan);
  border-color: var(--energy-cyan);
}

/* ── Research + Manuscript 캔버스 (_research.html 동일) ── */
.rc-wrap {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}
.rc-panels {
  display: grid;
  grid-template-columns: 1fr 1.2fr 0.8fr;
  gap: 0;
  flex: 1;
  overflow: hidden;
}
.rc-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--border);
}
.rc-panel:last-child { border-right: none; }
.rc-panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.rc-panel-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}
.rc-claim-count {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--surface2);
  padding: 2px 8px;
  border-radius: 8px;
}
.rc-live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border);
  margin-left: auto;
  transition: background 0.3s;
}
.rc-live-dot.streaming {
  background: #22c55e;
  box-shadow: 0 0 6px #22c55e88;
  animation: pulse-dot 1.5s infinite;
}
@keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.rc-ms-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 8px;
  background: var(--surface2);
  color: var(--text-muted);
}
.rc-ms-badge.draft { background: rgba(59,130,246,0.15); color: #93C5FD; }
.rc-ms-badge.final { background: rgba(34,197,94,0.15);  color: #86EFAC; }
.rc-status-badge {
  font-size: 10px; padding: 2px 8px; border-radius: 8px;
  background: var(--surface2); color: var(--text-muted);
}
.rc-status-badge.running { background: rgba(245,158,11,0.15); color: #FCD34D; }
.rc-status-badge.done    { background: rgba(34,197,94,0.15);  color: #86EFAC; }
.rc-status-item {
  padding: 8px 0; border-bottom: 1px solid var(--border);
  font-size: 12px; line-height: 1.6; color: var(--text-muted);
}
.rc-status-item:last-child { border-bottom: none; }
.rc-status-item strong { color: var(--text); display: block; margin-bottom: 2px; font-size: 11px; }
.rc-status-item pre {
  font-size: 11px; white-space: pre-wrap; word-break: break-word;
  background: var(--surface2); border-radius: 4px; padding: 6px 8px; margin: 4px 0 0;
  color: #A1A1AA;
}
.rc-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}
.rc-ch-section { margin-bottom: 24px; }
.rc-ch-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  padding: 6px 0 8px;
  border-bottom: 1px solid rgba(245,158,11,0.2);
  margin-bottom: 10px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 1;
}
.rc-claim {
  display: flex;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  animation: claim-in 0.3s ease;
}
@keyframes claim-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.rc-claim:last-child { border-bottom: none; }
.rc-claim-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-top: 7px;
  flex-shrink: 0;
}
.rc-claim-dot.high   { background: #22c55e; }
.rc-claim-dot.medium { background: #f59e0b; }
.rc-claim-dot.low    { background: #6b7280; }
.rc-claim-body { flex: 1; min-width: 0; }
.rc-claim-text {
  font-size: 13px;
  line-height: 1.6;
  color: #D4D4D8;
  word-break: keep-all;
}
.rc-claim-meta { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.rc-tag {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 500;
}
.rc-tag-kind     { background: rgba(99,102,241,0.15); color: #A5B4FC; }
.rc-tag-high     { background: rgba(34,197,94,0.12);  color: #86EFAC; }
.rc-tag-medium   { background: rgba(245,158,11,0.12); color: #FCD34D; }
.rc-tag-low      { background: rgba(107,114,128,0.15);color: #9CA3AF; }
.rc-tag-verified { background: rgba(34,197,94,0.08);  color: #6EE7B7; }
.rc-ms-chapter {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  margin: 24px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(245,158,11,0.2);
}
.rc-ms-chapter:first-child { margin-top: 0; }
.rc-ms-paragraph {
  font-size: 14px;
  line-height: 1.85;
  color: #D4D4D8;
  margin-bottom: 14px;
  word-break: keep-all;
}
.rc-ms-divider {
  border: none;
  border-top: 1px dashed rgba(255,255,255,0.1);
  margin: 12px 0;
}
.rc-empty {
  font-size: 13px;
  color: var(--text-muted);
  padding: 20px 0;
  text-align: center;
}
@media (max-width: 900px) {
  .rc-panels { grid-template-columns: 1fr; }
}
</style>

<script>
(function () {
  const slug = "{{ slug }}";
  if (!slug) return;

  const STEP_META = {
    step_0:            { label:"Preflight",             icon:"✓" },
    step_1a:           { label:"Skeleton Researcher",   icon:"1a" },
    step_1b:           { label:"Flesh Researcher",      icon:"1b" },
    step_2_draft:      { label:"Draft Writer",          icon:"2d" },
    step_2_target:     { label:"Targeted Researcher",   icon:"2t" },
    step_2_manuscript: { label:"Script Director (원고)", icon:"2m" },
    step_2:            { label:"Script Director (씬)",   icon:"2"  },
    step_2_consistency:{ label:"Consistency 보정",       icon:"2c" },
    step_2_review:     { label:"래칫 리뷰",               icon:"⚙"  },
    step_2_data:       { label:"Data Mapper",           icon:"2D" },
    step_2b:           { label:"Fact Verifier",         icon:"2b" },
    step_3b:           { label:"Assembly Director",     icon:"3b" },
    step_3c:           { label:"Upload Info",           icon:"3c" },
  };

  let currentView = 'split';
  let startTs = null;
  let elapsedTimer = null;
  let lastManuscriptText = "";

  // ── 뷰 전환 (split ↔ scenes) ──
  window.setContentView = function(view, tabEl) {
    document.querySelectorAll('.pctrl-tab').forEach(t => t.classList.remove('active'));
    if (tabEl) tabEl.classList.add('active');
    currentView = view;
    document.getElementById('split-view').style.display  = view === 'split'  ? 'flex' : 'none';
    document.getElementById('panel-scenes').style.display = view === 'scenes' ? 'flex' : 'none';
  };

  // ── 스텝 노드 상태 ──
  function setStepStatus(stepId, status) {
    const node = document.getElementById('sc-' + stepId);
    if (!node) return;
    node.className = 'tl-step-node ' + status;
    if (status === 'completed') node.textContent = '✓';
    else if (status === 'failed') node.textContent = '✗';
    else if (status === 'running') node.textContent = (STEP_META[stepId] || {}).icon || '●';
    else node.textContent = (STEP_META[stepId] || {}).icon || stepId.slice(-2);
  }

  // ── 이벤트 로그 ──
  function addEventRow(ts, type, body) {
    const feed = document.getElementById('panel-events');
    if (!feed) return;
    const row = document.createElement('div');
    row.className = 'event-row';
    const time = ts ? ts.slice(11,19) : new Date().toTimeString().slice(0,8);
    row.innerHTML = `<span class="event-ts">${time}</span>
      <span class="event-type ${type}">${type}</span>
      <span class="event-body">${escapeHtml(body)}</span>`;
    const placeholder = feed.querySelector('.event-row:first-child .event-type.info');
    if (placeholder && placeholder.textContent === '대기') feed.innerHTML = '';
    feed.appendChild(row);
    feed.scrollTop = feed.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ── 현재 스텝 헤더 ──
  function setStreamLabel(label, running) {
    const el = document.getElementById('stream-step-label');
    if (el) el.textContent = label;
    const dot = document.getElementById('stream-status-dot');
    if (dot) {
      dot.style.color = running ? 'var(--energy-cyan)' : 'var(--energy-mint)';
      dot.style.animation = running ? 'pulse-dot 1.5s ease infinite' : '';
    }
  }

  // ── elapsed 타이머 ──
  function startElapsed(fromTs) {
    if (elapsedTimer) clearInterval(elapsedTimer);
    startTs = fromTs ? new Date(fromTs).getTime() : Date.now();
    elapsedTimer = setInterval(() => {
      const sec = Math.floor((Date.now() - startTs) / 1000);
      const el = document.getElementById('stream-elapsed');
      if (el) el.textContent = sec < 60 ? sec + 's' : Math.floor(sec/60) + 'm ' + (sec%60) + 's';
    }, 1000);
  }
  function stopElapsed(fromTs) {
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    const el = document.getElementById('stream-elapsed');
    if (el) {
      if (fromTs && startTs) {
        const sec = Math.floor((new Date(fromTs).getTime() - startTs) / 1000);
        el.textContent = sec < 60 ? sec + 's' : Math.floor(sec/60) + 'm ' + (sec%60) + 's';
      } else {
        el.textContent = '—';
      }
    }
  }

  // ── 원고 갱신 ──
  function applyManuscript(text) {
    if (!text) return;
    lastManuscriptText = text;
    const ch = document.getElementById('stream-chars');
    if (ch) { ch.style.display = ''; ch.textContent = text.length + '자'; }
    const msBody = document.getElementById('rc-ms-body');
    if (!msBody) return;

    // ── 에이전트 메타 블록 분리 ──
    // "**작성 결과 요약:**", "**주의:**" 등 에이전트 상태 텍스트를 Status Panel로 분리
    const META_PATTERNS = [
      /^\*\*(작성 결과 요약|주의|참고|NOTE|WARNING|WARN|INFO|summary)[:：]/i,
      /^\[source_ingest\]|\[draft.writer\]|\[script.director\]|\[chapter_facts\]/i,
      /^알려진 사실 기반으로|^확인이 필요한 항목|^research_questions\.json/i,
    ];
    const SUMMARY_START = /^\*\*(작성 결과 요약|주의|참고)[:：]/i;

    const lines = text.split('\n');
    const manuscriptLines = [];
    const statusBlocks = [];
    let inMetaBlock = false;
    let currentMeta = [];

    lines.forEach(line => {
      const trimmed = line.trim();
      if (SUMMARY_START.test(trimmed)) {
        inMetaBlock = true;
        if (currentMeta.length) statusBlocks.push(currentMeta.join('\n'));
        currentMeta = [trimmed];
      } else if (inMetaBlock) {
        if (trimmed === '' && currentMeta.length > 3) {
          // 빈 줄 2회 연속이면 블록 종료로 간주
          statusBlocks.push(currentMeta.join('\n'));
          currentMeta = [];
          inMetaBlock = false;
        } else {
          currentMeta.push(line);
        }
      } else if (META_PATTERNS.some(p => p.test(trimmed))) {
        statusBlocks.push(trimmed);
      } else {
        manuscriptLines.push(line);
      }
    });
    if (currentMeta.length) statusBlocks.push(currentMeta.join('\n'));

    // Status Panel 업데이트
    _applyStatusBlocks(statusBlocks);

    // Manuscript Canvas — 순수 원고만
    msBody.innerHTML = '';
    let para = [];
    function flush() {
      if (!para.length) return;
      const t = para.join(' ').trim();
      if (!t) { para = []; return; }
      const p = document.createElement('div');
      p.className = 'rc-ms-paragraph';
      p.textContent = t;
      msBody.appendChild(p);
      para = [];
    }
    manuscriptLines.forEach(line => {
      if (/^#\s+(Ch\d+|챕터\s*\d+)/i.test(line)) {
        flush();
        const h = document.createElement('div');
        h.className = 'rc-ms-chapter';
        h.textContent = line.replace(/^#+\s*/, '');
        msBody.appendChild(h);
      } else if (line.trim() === '---') {
        flush();
        const hr = document.createElement('hr');
        hr.className = 'rc-ms-divider';
        msBody.appendChild(hr);
      } else if (line.trim().startsWith('<!--')) {
        // skip
      } else if (line.trim() === '') {
        flush();
      } else {
        para.push(line.trim());
      }
    });
    flush();
  }

  // ── Status Panel 채우기 ──
  function _applyStatusBlocks(blocks) {
    const body = document.getElementById('rc-status-body');
    const badge = document.getElementById('rc-status-badge');
    if (!body || !blocks.length) return;
    body.innerHTML = '';
    blocks.forEach((block, i) => {
      const item = document.createElement('div');
      item.className = 'rc-status-item';
      const lines = block.split('\n');
      const title = lines[0].replace(/\*\*/g, '').trim();
      const rest = lines.slice(1).join('\n').trim();
      item.innerHTML = `<strong>${escapeHtml(title)}</strong>${rest ? '<pre>' + escapeHtml(rest) + '</pre>' : ''}`;
      body.appendChild(item);
    });
    if (badge) { badge.textContent = '업데이트됨'; badge.className = 'rc-status-badge done'; }
  }

  // ── 씬스펙 갱신 ──
  function applyScenes(data) {
    const el = document.getElementById('panel-scenes');
    if (!el) return;
    const scenes = data.scenes || [];
    if (!scenes.length) return;
    el.innerHTML = '';
    scenes.forEach(scene => {
      const card = document.createElement('div');
      card.className = 'scene-stream-card';
      card.innerHTML = `<div class="scene-stream-num">#${scene.sceneNumber||'?'} ${escapeHtml(scene.title||'')}</div>
        <div class="scene-stream-narr">${escapeHtml((scene.narration||'').slice(0,200))}${(scene.narration||'').length>200?'…':''}</div>`;
      el.appendChild(card);
    });
  }

  // ── 스켈레톤/아웃라인 이벤트 로그 ──
  function applySkeletonSummary(data, label) {
    var bar = document.getElementById('skeleton-bar');
    var inner = document.getElementById('skeleton-bar-inner');
    if (!bar || !inner) return;

    var bullets = data.summary_bullets || [];
    var timeline = (data.timeline || []).slice(0, 5);
    var figures = (data.key_figures || []).slice(0, 4);

    var html = '<div class="sk-label">' + label + '</div>';

    if (bullets.length) {
      html += '<div class="sk-section">';
      bullets.forEach(function(b) {
        html += '<span class="sk-chip">' + _esc(b) + '</span>';
      });
      html += '</div>';
    }
    if (timeline.length) {
      html += '<div class="sk-section sk-timeline">';
      timeline.forEach(function(t) {
        var yr = t.year ? ('<span class="sk-yr">' + _esc(t.year) + '</span>') : '';
        html += '<span class="sk-tl-item">' + yr + _esc(t.event || '') + '</span>';
      });
      html += '</div>';
    }
    if (figures.length) {
      html += '<div class="sk-section">';
      figures.forEach(function(f) {
        html += '<span class="sk-chip sk-fig">' + _esc(f.name || '') + '</span>';
      });
      html += '</div>';
    }

    inner.innerHTML = html;
    bar.style.display = 'block';
  }

  function _esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── snapshot 적용 ──
  function applySnapshot(snap) {
    (snap.completed || []).forEach(id => setStepStatus(id, 'completed'));
    (snap.failed   || []).forEach(id => setStepStatus(id, 'failed'));
    (snap.skipped  || []).forEach(id => setStepStatus(id, 'skipped'));
    if (snap.current_step && !snap.finished_at) {
      setStepStatus(snap.current_step, 'running');
      setStreamLabel((STEP_META[snap.current_step]||{}).label || snap.current_step, true);
      startElapsed(snap.started_at || null);
    }
    if (snap.finished_at) {
      stopElapsed(snap.finished_at);
      setStreamLabel('파이프라인 완료', false);
    }
  }

  // ── SSE: 파이프라인 이벤트 ──
  const evtSrc = registerSse(new EventSource(`/api/p/${slug}/pipeline/events`));

  evtSrc.addEventListener('snapshot', e => {
    const snap = JSON.parse(e.data);
    applySnapshot(snap);
    if (snap.status === 'waiting') addEventRow(null, 'info', '파이프라인 시작 전 — 실행 대기 중');
  });

  evtSrc.addEventListener('live_update', e => {
    const d = JSON.parse(e.data);
    (d.completed || []).forEach(id => setStepStatus(id, 'completed'));
    (d.failed    || []).forEach(id => setStepStatus(id, 'failed'));
    (d.skipped   || []).forEach(id => setStepStatus(id, 'skipped'));
  });

  evtSrc.addEventListener('step_event', e => {
    const entry = JSON.parse(e.data);
    const evType = entry.event || 'info';
    const stepName = entry.step_name || entry.step || '';
    const agent = entry.agent || '';

    if (evType === 'step_started') {
      setStepStatus(entry.step, 'running');
      setStreamLabel(stepName || agent, true);
      startElapsed(entry.ts || null);
      addEventRow(entry.ts, 'started', `${stepName} 시작 (${agent})`);
    } else if (evType === 'step_completed') {
      setStepStatus(entry.step, 'completed');
      const dur = entry.duration_sec ? ` ${entry.duration_sec.toFixed(1)}s` : '';
      const cost = entry.cost_usd ? ` $${entry.cost_usd.toFixed(4)}` : '';
      stopElapsed(entry.ts || null);
      addEventRow(entry.ts, 'completed', `${stepName} 완료${dur}${cost}`);
    } else if (evType === 'step_failed') {
      setStepStatus(entry.step, 'failed');
      stopElapsed();
      addEventRow(entry.ts, 'failed', `${stepName} 실패 — ${entry.error || ''}`);
    } else if (evType === 'pipeline_finished') {
      stopElapsed();
      setStreamLabel('파이프라인 완료', false);
      addEventRow(entry.ts, 'completed', '파이프라인 전체 완료');
    }
  });

  evtSrc.addEventListener('pipeline_finished', e => {
    const d = JSON.parse(e.data);
    stopElapsed();
    setStreamLabel('파이프라인 완료', false);
    (d.completed || []).forEach(id => setStepStatus(id, 'completed'));
    (d.failed    || []).forEach(id => setStepStatus(id, 'failed'));
    addEventRow(null, 'completed', '파이프라인 완료');
  });

  evtSrc.onerror = () => addEventRow(null, 'info', 'SSE 연결 끊김 — 재연결 중...');

  // ── SSE: 파일 스트림 ──
  const fileSrc = registerSse(new EventSource(`/api/p/${slug}/pipeline/stream`));

  // 실시간 스트리밍 (stream-json 모드 — 원고 생성 중)
  fileSrc.addEventListener('manuscript_stream_updated', e => {
    const d = JSON.parse(e.data);
    if (d.text) applyManuscript(d.text);
  });

  fileSrc.addEventListener('manuscript_updated', e => {
    const d = JSON.parse(e.data);
    applyManuscript(d.text || '');
    const b = document.getElementById('rc-ms-badge');
    if (b) { b.textContent = '최종원고'; b.className = 'rc-ms-badge final'; }
  });

  fileSrc.addEventListener('draft_updated', e => {
    const d = JSON.parse(e.data);
    applyManuscript(d.text || '');
    const b = document.getElementById('rc-ms-badge');
    if (b) { b.textContent = '초고'; b.className = 'rc-ms-badge draft'; }
    addEventRow(null, 'info', `초고 업데이트 (${d.chars || 0}자)`);
  });

  fileSrc.addEventListener('scene_specs_updated', e => {
    const d = JSON.parse(e.data);
    applyScenes(d.data || {});
    addEventRow(null, 'info', `씬스펙 업데이트 (${(d.data && d.data.scenes ? d.data.scenes.length : 0)}씬)`);
  });

  fileSrc.addEventListener('skeleton_updated', e => {
    const d = JSON.parse(e.data);
    applySkeletonSummary(d.data || {}, '스켈레톤');
    addEventRow(null, 'info', '스켈레톤 생성 완료');
  });

  fileSrc.addEventListener('outline_updated', e => {
    const d = JSON.parse(e.data);
    applySkeletonSummary(d.data || {}, '아웃라인');
    addEventRow(null, 'info', '아웃라인 생성 완료');
  });

  fileSrc.addEventListener('review_updated', e => addEventRow(null, 'info', '래칫 리뷰 완료'));
  fileSrc.addEventListener('claims_updated', e => addEventRow(null, 'info', '타겟 클레임 업데이트'));

  // chapter_facts/ 폴더 — 챕터별 리서치 완료 이벤트 로그만
  fileSrc.addEventListener('chapter_facts_updated', e => {
    const d = JSON.parse(e.data);
    const chapter = d.chapter || '?';
    addEventRow(null, 'info', `챕터 리서치 완료: ${chapter}`);
  });

  fileSrc.onerror = () => {};

})();

// ── Research Canvas IIFE (_research.html과 동일, msEv 제외) ──
(function() {
  var slug = document.getElementById('rc-wrap').dataset.slug;
  var claimsBody = document.getElementById('rc-claims-body');
  var countEl = document.getElementById('rc-claim-count');
  var liveDot = document.getElementById('rc-live-dot');
  var msBadge = document.getElementById('rc-ms-badge');

  var chapterMap = {};
  var claimsByChapter = {};
  var totalClaims = 0;

  // 1. outline + claims 초기 로드
  fetch('/api/p/' + slug + '/research/canvas')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      chapterMap = d.chapter_map || {};
      claimsByChapter = d.grouped_claims || {};
      totalClaims = d.total_claims || 0;
      renderClaims();
      if (countEl) countEl.textContent = totalClaims + ' claims';
    })
    .catch(function() {
      if (claimsBody) claimsBody.innerHTML = '<div class="rc-empty">리서치 데이터가 없습니다</div>';
    });

  function renderClaims() {
    if (!claimsBody) return;
    var keys = Object.keys(claimsByChapter).sort(function(a,b){ return (parseInt(a)||999)-(parseInt(b)||999); });
    if (!keys.length) { claimsBody.innerHTML = '<div class="rc-empty">수집된 claim이 없습니다</div>'; return; }
    claimsBody.innerHTML = '';
    keys.forEach(function(chId) {
      var claims = claimsByChapter[chId];
      if (!claims || !claims.length) return;
      claimsBody.appendChild(buildChapterSection(chId, claims));
    });
  }

  function buildChapterSection(chId, claims) {
    var section = document.createElement('div');
    section.className = 'rc-ch-section';
    section.id = 'rc-ch-' + chId;
    var chTitle = chapterMap[chId] || chapterMap[parseInt(chId)] || '';
    var titleEl = document.createElement('div');
    titleEl.className = 'rc-ch-title';
    titleEl.textContent = chTitle ? ('Ch' + chId + '. ' + chTitle) : ('Chapter ' + chId);
    section.appendChild(titleEl);
    claims.forEach(function(c) { section.appendChild(buildClaimCard(c)); });
    return section;
  }

  function buildClaimCard(c) {
    var conf = c.confidence || 'medium';
    var dotClass = conf === 'high' ? 'high' : conf === 'medium' ? 'medium' : 'low';
    var card = document.createElement('div');
    card.className = 'rc-claim';
    var dot = document.createElement('div');
    dot.className = 'rc-claim-dot ' + dotClass;
    var body = document.createElement('div');
    body.className = 'rc-claim-body';
    var text = document.createElement('div');
    text.className = 'rc-claim-text';
    text.textContent = c.claim || '';
    var meta = document.createElement('div');
    meta.className = 'rc-claim-meta';
    if (c.kind) {
      var t1 = document.createElement('span');
      t1.className = 'rc-tag rc-tag-kind';
      t1.textContent = c.kind;
      meta.appendChild(t1);
    }
    var t2 = document.createElement('span');
    t2.className = 'rc-tag rc-tag-' + dotClass;
    t2.textContent = conf;
    meta.appendChild(t2);
    if (c.status === 'verified') {
      var t3 = document.createElement('span');
      t3.className = 'rc-tag rc-tag-verified';
      t3.textContent = '✓';
      meta.appendChild(t3);
    }
    body.appendChild(text);
    body.appendChild(meta);
    card.appendChild(dot);
    card.appendChild(body);
    return card;
  }

  // 2. SSE: claims 실시간
  var claimsEv = registerSse(new EventSource('/api/p/' + slug + '/pipeline/research/claims/stream'));

  claimsEv.addEventListener('claims_snapshot', function(e) {
    try {
      var d = JSON.parse(e.data);
      if (d.total > totalClaims) {
        totalClaims = d.total;
        if (countEl) countEl.textContent = totalClaims + ' claims';
      }
    } catch(err) {}
  });

  claimsEv.addEventListener('claims_new', function(e) {
    try {
      var d = JSON.parse(e.data);
      var newClaims = d.claims || [];
      if (!newClaims.length) return;
      if (liveDot) { liveDot.classList.add('streaming'); setTimeout(function(){ liveDot.classList.remove('streaming'); }, 2000); }
      totalClaims += newClaims.length;
      if (countEl) countEl.textContent = totalClaims + ' claims';
      newClaims.forEach(function(c) {
        var chId = String(c.chapter || 'unassigned');
        var section = document.getElementById('rc-ch-' + chId);
        if (!section) { section = buildChapterSection(chId, []); if (claimsBody) claimsBody.appendChild(section); }
        section.appendChild(buildClaimCard(c));
      });
    } catch(err) {}
  });

})();
</script>

<!-- Research 탭 — 위키 스타일 뷰어 -->
<div class="wiki-wrap" id="wiki-wrap" data-slug="{{ slug }}">
  <div class="wiki-sidebar" id="wiki-sidebar">
    <div class="wiki-sidebar-title">Research Wiki</div>
    <nav class="wiki-nav" id="wiki-nav">
      <div class="wiki-nav-loading">페이지 목록 로딩 중...</div>
    </nav>
  </div>
  <div class="wiki-content" id="wiki-content">
    <div class="wiki-placeholder">왼쪽에서 페이지를 선택하세요</div>
  </div>
</div>

<style>
.wiki-wrap {
  display: flex;
  height: calc(100vh - 90px);
  overflow: hidden;
}

.wiki-sidebar {
  width: 180px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.wiki-sidebar-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-muted);
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.wiki-nav {
  overflow-y: auto;
  flex: 1;
  padding: 8px 0;
}

.wiki-nav-loading {
  font-size: 12px;
  color: var(--text-muted);
  padding: 12px 16px;
}

.wiki-nav-item {
  display: block;
  padding: 7px 16px;
  font-size: 13px;
  color: #A1A1AA;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.15s, color 0.15s;
  text-transform: capitalize;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.wiki-nav-item:hover { background: rgba(255,255,255,0.05); color: #E4E4E7; }
.wiki-nav-item.active { background: rgba(245,158,11,0.12); color: var(--accent, #F59E0B); font-weight: 600; }

.wiki-content {
  flex: 1;
  overflow-y: auto;
  padding: 28px 36px;
  max-width: 820px;
}

.wiki-placeholder {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 40px;
  text-align: center;
}

/* 마크다운 스타일 */
.wiki-body h1 { font-size: 22px; font-weight: 700; color: #F4F4F5; margin: 0 0 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.wiki-body h2 { font-size: 16px; font-weight: 700; color: var(--accent, #F59E0B); margin: 28px 0 10px; }
.wiki-body h3 { font-size: 14px; font-weight: 600; color: #D4D4D8; margin: 20px 0 8px; }
.wiki-body p { font-size: 14px; line-height: 1.85; color: #D4D4D8; margin-bottom: 14px; word-break: keep-all; }
.wiki-body ul, .wiki-body ol { padding-left: 20px; margin-bottom: 14px; }
.wiki-body li { font-size: 14px; line-height: 1.75; color: #D4D4D8; margin-bottom: 4px; }
.wiki-body blockquote { border-left: 3px solid rgba(245,158,11,0.4); padding: 8px 16px; margin: 12px 0; background: rgba(245,158,11,0.06); border-radius: 0 6px 6px 0; }
.wiki-body blockquote p { color: #A1A1AA; margin: 0; }
.wiki-body code { font-family: monospace; font-size: 12px; background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; color: #FCA5A5; }
.wiki-body pre { background: rgba(0,0,0,0.3); border-radius: 6px; padding: 14px 16px; overflow-x: auto; margin-bottom: 14px; }
.wiki-body pre code { background: none; padding: 0; color: #D4D4D8; }
.wiki-body hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 20px 0; }
.wiki-body table { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 13px; }
.wiki-body th { background: rgba(255,255,255,0.06); padding: 8px 12px; text-align: left; color: #A1A1AA; border-bottom: 1px solid var(--border); }
.wiki-body td { padding: 7px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #D4D4D8; }
.wiki-body strong { color: #F4F4F5; font-weight: 600; }
.wiki-body em { color: #A1A1AA; }

/* Claims 카드 */
.wiki-claims-wrap { width: 100%; }
.wiki-claims-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.wiki-claims-title { font-size: 16px; font-weight: 700; color: #F4F4F5; }
.wiki-claims-count { font-size: 11px; color: var(--text-muted); background: rgba(255,255,255,0.07); padding: 2px 9px; border-radius: 10px; }

.wiki-claim-card { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.wiki-claim-card:last-child { border-bottom: none; }
.wiki-claim-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }
.conf-high { background: #22c55e; }
.conf-med  { background: #f59e0b; }
.conf-low  { background: #6b7280; }
.wiki-claim-body { flex: 1; min-width: 0; }
.wiki-claim-text { font-size: 14px; line-height: 1.75; color: #D4D4D8; word-break: keep-all; margin-bottom: 5px; }
.wiki-claim-evidence { font-size: 12px; color: #71717A; margin-bottom: 6px; font-style: italic; }
.wiki-claim-meta { display: flex; gap: 5px; flex-wrap: wrap; }
.wiki-claim-tag { font-size: 10px; padding: 1px 7px; border-radius: 4px; font-weight: 500; }
.tag-kind     { background: rgba(99,102,241,0.15); color: #A5B4FC; }
.tag-high     { background: rgba(34,197,94,0.12);  color: #86EFAC; }
.tag-medium   { background: rgba(245,158,11,0.12); color: #FCD34D; }
.tag-low      { background: rgba(107,114,128,0.15);color: #9CA3AF; }
.tag-verified { background: rgba(34,197,94,0.08);  color: #6EE7B7; }
</style>

<script>
(function() {
  var slug = document.getElementById('wiki-wrap').dataset.slug;
  var nav = document.getElementById('wiki-nav');
  var content = document.getElementById('wiki-content');
  var currentPage = null;

  // 페이지 표시 순서 및 레이블 정의
  var PAGE_LABELS = {
    'index': '인덱스',
    'overview': '개요',
    'claims': '주요 주장',
    'timeline': '타임라인',
    'entities': '등장인물/기관',
    'images': '이미지',
    'questions': '연구 질문',
    'log': '수집 로그'
  };
  var PAGE_ORDER = ['overview', 'claims', 'timeline', 'entities', 'images', 'questions', 'log', 'index'];

  fetch('/api/p/' + slug + '/research/wiki')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var pages = d.pages || [];
      if (!pages.length) {
        nav.innerHTML = '<div class="wiki-nav-loading">위키 페이지가 없습니다</div>';
        return;
      }

      // 정의된 순서로 정렬, 나머지는 뒤에
      pages.sort(function(a, b) {
        var ia = PAGE_ORDER.indexOf(a), ib = PAGE_ORDER.indexOf(b);
        if (ia === -1) ia = 99;
        if (ib === -1) ib = 99;
        return ia - ib;
      });

      nav.innerHTML = '';
      pages.forEach(function(page) {
        var btn = document.createElement('button');
        btn.className = 'wiki-nav-item';
        btn.textContent = PAGE_LABELS[page] || page;
        btn.onclick = function() { loadPage(page, btn); };
        nav.appendChild(btn);
      });

      // 첫 번째 페이지 자동 로드
      var firstBtn = nav.querySelector('.wiki-nav-item');
      if (firstBtn) firstBtn.click();
    })
    .catch(function() {
      nav.innerHTML = '<div class="wiki-nav-loading">로드 실패</div>';
    });

  function loadPage(page, btn) {
    if (currentPage === page) return;
    currentPage = page;

    nav.querySelectorAll('.wiki-nav-item').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');

    content.innerHTML = '<div class="wiki-placeholder">로딩 중...</div>';

    fetch('/api/p/' + slug + '/research/wiki/' + page)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.error) {
          content.innerHTML = '<div class="wiki-placeholder">' + d.error + '</div>';
          return;
        }
        content.innerHTML = '';
        // claims 페이지는 카드 렌더링
        if (d.claims !== undefined) {
          content.appendChild(renderClaims(d.claims));
          return;
        }
        var body = document.createElement('div');
        body.className = 'wiki-body';
        body.innerHTML = simpleMarkdown(d.content || '');
        content.appendChild(body);
      })
      .catch(function() {
        content.innerHTML = '<div class="wiki-placeholder">페이지를 불러올 수 없습니다</div>';
      });
  }

  // 간단한 마크다운 → HTML 변환 (marked.js 없이)
  function simpleMarkdown(md) {
    var html = md
      // 코드 블록 (먼저 처리)
      .replace(/```[\w]*\n([\s\S]*?)```/g, function(_, code) {
        return '<pre><code>' + escHtml(code.trim()) + '</code></pre>';
      })
      // 제목
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      // 인용
      .replace(/^> (.+)$/gm, '<blockquote><p>$1</p></blockquote>')
      // HR
      .replace(/^---+$/gm, '<hr>')
      // 굵게/이탤릭
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      // 인라인 코드
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      // 순서없는 목록 — 줄 단위로 처리
      .replace(/((?:^[-*] .+\n?)+)/gm, function(block) {
        var items = block.trim().split('\n').map(function(l) {
          return '<li>' + l.replace(/^[-*] /, '') + '</li>';
        }).join('');
        return '<ul>' + items + '</ul>';
      })
      // 순서있는 목록
      .replace(/((?:^\d+\. .+\n?)+)/gm, function(block) {
        var items = block.trim().split('\n').map(function(l) {
          return '<li>' + l.replace(/^\d+\. /, '') + '</li>';
        }).join('');
        return '<ol>' + items + '</ol>';
      })
      // 빈 줄 → 단락 구분
      .replace(/\n{2,}/g, '\n\n');

    // 단락 감싸기 (h1~h6, pre, ul, ol, hr, blockquote 제외)
    var lines = html.split('\n\n');
    html = lines.map(function(block) {
      if (!block.trim()) return '';
      if (/^<(h[1-6]|pre|ul|ol|hr|blockquote)/.test(block.trim())) return block;
      return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');

    return html;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderClaims(claims) {
    var wrap = document.createElement('div');
    wrap.className = 'wiki-claims-wrap';

    var header = document.createElement('div');
    header.className = 'wiki-claims-header';
    header.innerHTML = '<span class="wiki-claims-title">주요 주장</span>'
      + '<span class="wiki-claims-count">' + claims.length + '건</span>';
    wrap.appendChild(header);

    if (!claims.length) {
      var empty = document.createElement('div');
      empty.className = 'wiki-placeholder';
      empty.textContent = '수집된 주장이 없습니다';
      wrap.appendChild(empty);
      return wrap;
    }

    var CONF_CLASS = { high: 'conf-high', medium: 'conf-med', low: 'conf-low' };
    var CONF_LABEL = { high: '높음', medium: '보통', low: '낮음' };
    var KIND_LABEL = { factual: '사실', fact: '사실', analytical: '분석', opinion: '의견', contextual: '맥락' };

    claims.forEach(function(c) {
      var conf = c.confidence || 'medium';
      var card = document.createElement('div');
      card.className = 'wiki-claim-card';

      var dot = document.createElement('div');
      dot.className = 'wiki-claim-dot ' + (CONF_CLASS[conf] || 'conf-med');

      var body = document.createElement('div');
      body.className = 'wiki-claim-body';

      var text = document.createElement('div');
      text.className = 'wiki-claim-text';
      text.textContent = c.claim || '';
      body.appendChild(text);

      if (c.evidence && c.evidence !== 'n/a' && c.evidence !== '') {
        var ev = document.createElement('div');
        ev.className = 'wiki-claim-evidence';
        ev.textContent = c.evidence;
        body.appendChild(ev);
      }

      var meta = document.createElement('div');
      meta.className = 'wiki-claim-meta';
      if (c.kind) {
        var k = document.createElement('span');
        k.className = 'wiki-claim-tag tag-kind';
        k.textContent = KIND_LABEL[c.kind] || c.kind;
        meta.appendChild(k);
      }
      var cf = document.createElement('span');
      cf.className = 'wiki-claim-tag tag-' + conf;
      cf.textContent = CONF_LABEL[conf] || conf;
      meta.appendChild(cf);
      if (c.status === 'verified') {
        var st = document.createElement('span');
        st.className = 'wiki-claim-tag tag-verified';
        st.textContent = '검증됨';
        meta.appendChild(st);
      }
      body.appendChild(meta);

      card.appendChild(dot);
      card.appendChild(body);
      wrap.appendChild(card);
    });

    return wrap;
  }
})();
</script>

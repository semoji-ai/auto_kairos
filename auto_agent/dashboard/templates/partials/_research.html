<!-- Research 탭 — 위키 스타일 뷰어 -->
<div class="wiki-wrap" id="wiki-wrap" data-slug="{{ slug }}">
  <div class="wiki-sidebar" id="wiki-sidebar">
    <div class="wiki-sidebar-title">Research Wiki</div>
    <nav class="wiki-nav" id="wiki-nav">
      <div class="wiki-nav-loading">페이지 목록 로딩 중...</div>
    </nav>
  </div>
  <div class="wiki-content" id="wiki-content">
    <div class="wiki-placeholder">왼쪽에서 페이지를 선택하세요</div>
  </div>
</div>

<style>
.wiki-wrap {
  display: flex;
  height: calc(100vh - 90px);
  overflow: hidden;
}

.wiki-sidebar {
  width: 180px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.wiki-sidebar-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-muted);
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.wiki-nav {
  overflow-y: auto;
  flex: 1;
  padding: 8px 0;
}

.wiki-nav-loading {
  font-size: 12px;
  color: var(--text-muted);
  padding: 12px 16px;
}

.wiki-nav-item {
  display: block;
  padding: 7px 16px;
  font-size: 13px;
  color: #A1A1AA;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.15s, color 0.15s;
  text-transform: capitalize;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.wiki-nav-item:hover { background: rgba(255,255,255,0.05); color: #E4E4E7; }
.wiki-nav-item.active { background: rgba(245,158,11,0.12); color: var(--accent, #F59E0B); font-weight: 600; }

.wiki-content {
  flex: 1;
  overflow-y: auto;
  padding: 28px 36px;
  max-width: 820px;
}

.wiki-placeholder {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 40px;
  text-align: center;
}

/* ── 이미지 그리드 ── */
.img-grid-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
}
.img-grid-count { font-size: 11px; color: var(--text-muted); min-width: 60px; }
.img-grid-search {
  flex: 1; min-width: 140px; max-width: 260px;
  padding: 5px 10px; border-radius: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 12px; outline: none;
}
.img-grid-search:focus { border-color: rgba(245,158,11,0.4); }
.img-filter-label { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; cursor: pointer; }

.img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}
.img-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
}
.img-card:hover { border-color: rgba(245,158,11,0.4); transform: translateY(-1px); }
.img-thumb-wrap { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: var(--bg); }
.img-thumb { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.2s; }
.img-thumb:hover { opacity: 0.85; }
.img-card-meta { padding: 6px 8px 8px; }
.img-card-title {
  font-size: 10px; color: var(--text-muted); line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-bottom: 4px;
}
.img-card-badges { display: flex; gap: 4px; flex-wrap: wrap; }
.img-badge {
  font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 500;
}
.img-badge-src  { background: rgba(59,130,246,0.15); color: #93C5FD; }
.img-badge-cc   { background: rgba(34,197,94,0.15);  color: #86EFAC; }
.img-badge-lic  { background: rgba(255,255,255,0.06); color: var(--text-muted); }

/* 이미지 모달 */
.img-modal { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; }
.img-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.75); }
.img-modal-box {
  position: relative; max-width: 90vw; max-height: 90vh;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; display: flex; flex-direction: column;
}
.img-modal-close {
  position: absolute; top: 10px; right: 10px; z-index: 1;
  background: rgba(0,0,0,0.5); border: none; color: white;
  border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 13px;
}
.img-modal-img { max-width: 85vw; max-height: 75vh; object-fit: contain; display: block; }
.img-modal-info { padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.img-modal-title { font-size: 13px; color: var(--text-muted); }
.img-modal-link { font-size: 12px; color: var(--accent, #F59E0B); text-decoration: none; white-space: nowrap; }
.img-modal-link:hover { text-decoration: underline; }

/* 마크다운 스타일 */
.wiki-body h1 { font-size: 22px; font-weight: 700; color: #F4F4F5; margin: 0 0 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.wiki-body h2 { font-size: 16px; font-weight: 700; color: var(--accent, #F59E0B); margin: 28px 0 10px; }
.wiki-body h3 { font-size: 14px; font-weight: 600; color: #D4D4D8; margin: 20px 0 8px; }
.wiki-body p { font-size: 14px; line-height: 1.85; color: #D4D4D8; margin-bottom: 14px; word-break: keep-all; }
.wiki-body ul, .wiki-body ol { padding-left: 20px; margin-bottom: 14px; }
.wiki-body li { font-size: 14px; line-height: 1.75; color: #D4D4D8; margin-bottom: 4px; }
.wiki-body blockquote { border-left: 3px solid rgba(245,158,11,0.4); padding: 8px 16px; margin: 12px 0; background: rgba(245,158,11,0.06); border-radius: 0 6px 6px 0; }
.wiki-body blockquote p { color: #A1A1AA; margin: 0; }
.wiki-body code { font-family: monospace; font-size: 12px; background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; color: #FCA5A5; }
.wiki-body pre { background: rgba(0,0,0,0.3); border-radius: 6px; padding: 14px 16px; overflow-x: auto; margin-bottom: 14px; }
.wiki-body pre code { background: none; padding: 0; color: #D4D4D8; }
.wiki-body hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 20px 0; }
.wiki-body table { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 13px; }
.wiki-body th { background: rgba(255,255,255,0.06); padding: 8px 12px; text-align: left; color: #A1A1AA; border-bottom: 1px solid var(--border); }
.wiki-body td { padding: 7px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #D4D4D8; }
.wiki-body strong { color: #F4F4F5; font-weight: 600; }
.wiki-body em { color: #A1A1AA; }

/* Claims 카드 */
.wiki-claims-wrap { width: 100%; }
.wiki-claims-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.wiki-claims-title { font-size: 16px; font-weight: 700; color: #F4F4F5; }
.wiki-claims-count { font-size: 11px; color: var(--text-muted); background: rgba(255,255,255,0.07); padding: 2px 9px; border-radius: 10px; }

.wiki-claim-card { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.wiki-claim-card:last-child { border-bottom: none; }
.wiki-claim-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }
.conf-high { background: #22c55e; }
.conf-med  { background: #f59e0b; }
.conf-low  { background: #6b7280; }
.wiki-claim-body { flex: 1; min-width: 0; }
.wiki-claim-text { font-size: 14px; line-height: 1.75; color: #D4D4D8; word-break: keep-all; margin-bottom: 5px; }
.wiki-claim-evidence { font-size: 12px; color: #71717A; margin-bottom: 6px; font-style: italic; }
.wiki-claim-meta { display: flex; gap: 5px; flex-wrap: wrap; }
.wiki-claim-tag { font-size: 10px; padding: 1px 7px; border-radius: 4px; font-weight: 500; }
.tag-kind     { background: rgba(99,102,241,0.15); color: #A5B4FC; }
.tag-high     { background: rgba(34,197,94,0.12);  color: #86EFAC; }
.tag-medium   { background: rgba(245,158,11,0.12); color: #FCD34D; }
.tag-low      { background: rgba(107,114,128,0.15);color: #9CA3AF; }
.tag-verified { background: rgba(34,197,94,0.08);  color: #6EE7B7; }

/* 클레임 인라인 썸네일 */
.claim-thumb-wrap {
  width: 72px; height: 48px; flex-shrink: 0;
  border-radius: 5px; overflow: hidden;
  background: var(--surface2); border: 1px solid var(--border);
  cursor: pointer;
}
.claim-thumb {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: opacity 0.2s;
}
.claim-thumb:hover { opacity: 0.8; }

/* wiki 페이지 관련 이미지 스트립 */
.wiki-img-strip {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 20px; padding-bottom: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.wiki-img-strip-label {
  width: 100%; font-size: 10px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
}
.wiki-strip-thumb {
  width: 90px; height: 60px; border-radius: 5px; overflow: hidden;
  background: var(--surface2); border: 1px solid var(--border);
  cursor: pointer; flex-shrink: 0;
}
.wiki-strip-thumb img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: opacity 0.2s;
}
.wiki-strip-thumb:hover img { opacity: 0.8; }
.wiki-strip-thumb-title {
  font-size: 9px; color: var(--text-muted); padding: 3px 5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
</style>

<script>
(function() {
  var slug = document.getElementById('wiki-wrap').dataset.slug;
  var nav = document.getElementById('wiki-nav');
  var content = document.getElementById('wiki-content');
  var currentPage = null;

  // 페이지 표시 순서 및 레이블 정의
  var PAGE_LABELS = {
    '__research_data__': '📊 수집 자료',
    'index': '인덱스',
    'overview': '개요',
    'claims': '주요 주장',
    'timeline': '타임라인',
    'entities': '등장인물/기관',
    'images': '이미지',
    'questions': '연구 질문',
    'log': '수집 로그',
    '__targeted__': '🎯 타겟 리서치'
  };
  var PAGE_ORDER = ['__research_data__', 'overview', 'claims', 'timeline', 'entities', 'images', 'questions', 'log', 'index', '__targeted__'];

  fetch('/api/p/' + encodeURIComponent(slug) + '/research/wiki')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var pages = d.pages || [];
      if (!pages.length) {
        nav.innerHTML = '<div class="wiki-nav-loading">위키 없음</div>';
        loadTargetedClaimsView();
        return;
      }
      // 수집 자료 + 타겟 리서치 항목 항상 추가 (페이지 없어도 표시)
      pages = ['__research_data__'].concat(pages, ['__targeted__']);

      // 정의된 순서로 정렬, 나머지는 뒤에
      pages.sort(function(a, b) {
        var ia = PAGE_ORDER.indexOf(a), ib = PAGE_ORDER.indexOf(b);
        if (ia === -1) ia = 99;
        if (ib === -1) ib = 99;
        return ia - ib;
      });

      nav.innerHTML = '';
      pages.forEach(function(page) {
        var btn = document.createElement('button');
        btn.className = 'wiki-nav-item';
        btn.dataset.page = page;
        btn.textContent = PAGE_LABELS[page] || page;
        if (page === '__targeted__') btn.style.cssText = 'color:#FCD34D;border-top:1px solid rgba(245,158,11,.2);margin-top:6px;padding-top:10px;';
        btn.onclick = function() { loadPage(page, btn); };
        nav.appendChild(btn);
      });

      // 수집 자료 버튼 우선 클릭 (가장 풍부한 데이터)
      var dataBtn = Array.from(nav.querySelectorAll('.wiki-nav-item')).find(function(b) { return b.dataset.page === '__research_data__'; });
      var firstBtn = dataBtn || nav.querySelector('.wiki-nav-item');
      if (firstBtn) firstBtn.click();
    })
    .catch(function() {
      nav.innerHTML = '<div class="wiki-nav-loading">로드 실패</div>';
    });

  function loadPage(page, btn) {
    if (currentPage === page) return;
    currentPage = page;

    nav.querySelectorAll('.wiki-nav-item').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');

    content.innerHTML = '<div class="wiki-placeholder">로딩 중...</div>';

    // 수집 자료 페이지 — 모든 sources + claims 통합 뷰
    if (page === '__research_data__') {
      loadResearchDataView();
      return;
    }

    // 타겟 리서치 페이지
    if (page === '__targeted__') {
      loadTargetedClaimsView();
      return;
    }

    // 이미지 페이지는 별도 API 호출
    if (page === 'images') {
      loadImagePage();
      return;
    }

    fetch('/api/p/' + encodeURIComponent(slug) + '/research/wiki/' + page)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.error) {
          content.innerHTML = '<div class="wiki-placeholder">' + d.error + '</div>';
          return;
        }
        content.innerHTML = '';
        // claims 페이지는 카드 렌더링
        if (d.claims !== undefined) {
          ensureImages().then(function() {
            content.innerHTML = '';
            content.appendChild(renderClaims(d.claims));
          });
          return;
        }
        var body = document.createElement('div');
        body.className = 'wiki-body';
        body.innerHTML = simpleMarkdown(d.content || '');
        // wiki 페이지 관련 이미지 스트립
        ensureImages().then(function() {
          var matches = findMatchingImages(page + ' ' + (d.content || '').slice(0, 300), 5);
          if (matches.length) {
            var strip = document.createElement('div');
            strip.className = 'wiki-img-strip';
            var lbl = document.createElement('div');
            lbl.className = 'wiki-img-strip-label';
            lbl.textContent = '관련 이미지';
            strip.appendChild(lbl);
            matches.forEach(function(img) {
              var wrap = document.createElement('div');
              wrap.className = 'wiki-strip-thumb';
              wrap.innerHTML =
                '<img src="' + escAttr(img.image_url) + '" loading="lazy" ' +
                     'onerror="this.closest(\'.wiki-strip-thumb\').style.display=\'none\'" ' +
                     'onclick="openImgModal(\'' + escAttr(img.image_url) + '\',\'' + escAttr(img.title||'') + '\',\'' + escAttr(img.source_url||'') + '\')">' +
                '<div class="wiki-strip-thumb-title" title="' + escAttr(img.title||'') + '">' + escHtml(img.title||'') + '</div>';
              strip.appendChild(wrap);
            });
            content.insertBefore(strip, content.firstChild);
          }
        });
        content.appendChild(body);
      })
      .catch(function() {
        content.innerHTML = '<div class="wiki-placeholder">페이지를 불러올 수 없습니다</div>';
      });
  }

  // ── 이미지 데이터 (캐시 + 프리로드) ──────────────────────────
  var _imgData = null;
  var _imgPromise = null;

  function ensureImages() {
    if (_imgData !== null) return Promise.resolve(_imgData);
    if (_imgPromise) return _imgPromise;
    _imgPromise = fetch('/api/p/' + encodeURIComponent(slug) + '/research/images')
      .then(function(r) { return r.json(); })
      .then(function(d) { _imgData = d.images || []; return _imgData; })
      .catch(function() { _imgData = []; return []; });
    return _imgPromise;
  }

  // 백그라운드에서 미리 로드
  ensureImages();

  // ── 이미지 매칭 ───────────────────────────────────────────
  function findMatchingImages(text, limit) {
    limit = limit || 3;
    if (!_imgData || !_imgData.length || !text) return [];
    // 3자 이상 단어 추출 (한국어 포함)
    var words = text.replace(/[^\w가-힣]/g, ' ').split(/\s+/)
      .filter(function(w) { return w.length >= 3; })
      .map(function(w) { return w.toLowerCase(); });
    if (!words.length) return [];

    var scored = _imgData.map(function(img) {
      var title = (img.title || '').toLowerCase();
      var score = words.reduce(function(s, w) {
        return s + (title.indexOf(w) >= 0 ? 1 : 0);
      }, 0);
      return { img: img, score: score };
    }).filter(function(x) { return x.score > 0; });

    scored.sort(function(a, b) { return b.score - a.score; });
    return scored.slice(0, limit).map(function(x) { return x.img; });
  }

  function loadImagePage() {
    content.innerHTML = '<div class="wiki-placeholder">이미지 로딩 중...</div>';
    ensureImages().then(function(imgs) { renderImageGrid(imgs); });
  }

  function renderImageGrid(images) {
    content.innerHTML = '';
    if (!images.length) {
      content.innerHTML = '<div class="wiki-placeholder">수집된 이미지가 없습니다.<br><small>리서치 완료 후 자동 수집됩니다.</small></div>';
      return;
    }

    // 헤더
    var hdr = document.createElement('div');
    hdr.className = 'img-grid-header';
    hdr.innerHTML =
      '<span class="img-grid-count">' + images.length + '개 이미지</span>' +
      '<input class="img-grid-search" type="text" placeholder="제목·출처 검색..." oninput="filterImages(this.value)">' +
      '<label class="img-filter-label"><input type="checkbox" id="img-cc-only" onchange="filterImages()"> CC 라이선스만</label>';
    content.appendChild(hdr);

    // 그리드
    var grid = document.createElement('div');
    grid.className = 'img-grid';
    grid.id = 'img-grid';
    images.forEach(function(img, idx) {
      grid.appendChild(makeImageCard(img, idx));
    });
    content.appendChild(grid);
  }

  function makeImageCard(img, idx) {
    var card = document.createElement('div');
    card.className = 'img-card';
    card.dataset.title = (img.title || '').toLowerCase();
    card.dataset.source = (img.image_source || '').toLowerCase();
    card.dataset.license = (img.image_license || '').toLowerCase();

    var srcBadge = img.image_source === 'wikimedia' ? 'Wiki' :
                   img.image_source === 'news_rss'  ? 'News' : img.image_source || '?';
    var licBadge = img.image_license ? img.image_license : '';
    var isCC = licBadge.toLowerCase().startsWith('cc');

    card.innerHTML =
      '<div class="img-thumb-wrap">' +
        '<img class="img-thumb" src="' + escAttr(img.image_url) + '" loading="lazy" ' +
             'onerror="this.closest(\'.img-card\').style.display=\'none\'" ' +
             'onclick="openImgModal(\'' + escAttr(img.image_url) + '\',\'' + escAttr(img.title||'') + '\',\'' + escAttr(img.source_url||'') + '\')">' +
      '</div>' +
      '<div class="img-card-meta">' +
        '<div class="img-card-title" title="' + escAttr(img.title||'') + '">' + escHtml(img.title || '(제목 없음)') + '</div>' +
        '<div class="img-card-badges">' +
          '<span class="img-badge img-badge-src">' + escHtml(srcBadge) + '</span>' +
          (licBadge ? '<span class="img-badge ' + (isCC ? 'img-badge-cc' : 'img-badge-lic') + '">' + escHtml(licBadge) + '</span>' : '') +
        '</div>' +
      '</div>';
    return card;
  }

  window.filterImages = function(query) {
    query = (query || document.querySelector('.img-grid-search')?.value || '').toLowerCase();
    var ccOnly = document.getElementById('img-cc-only')?.checked || false;
    var cards = document.querySelectorAll('#img-grid .img-card');
    cards.forEach(function(card) {
      var titleMatch = !query || card.dataset.title.includes(query) || card.dataset.source.includes(query);
      var licMatch = !ccOnly || card.dataset.license.startsWith('cc');
      card.style.display = (titleMatch && licMatch) ? '' : 'none';
    });
  };

  window.openImgModal = function(url, title, sourceUrl) {
    var existing = document.getElementById('img-modal');
    if (existing) existing.remove();
    var modal = document.createElement('div');
    modal.id = 'img-modal';
    modal.className = 'img-modal';
    modal.innerHTML =
      '<div class="img-modal-backdrop" onclick="document.getElementById(\'img-modal\').remove()"></div>' +
      '<div class="img-modal-box">' +
        '<button class="img-modal-close" onclick="document.getElementById(\'img-modal\').remove()">✕</button>' +
        '<img class="img-modal-img" src="' + escAttr(url) + '">' +
        '<div class="img-modal-info">' +
          (title ? '<div class="img-modal-title">' + escHtml(title) + '</div>' : '') +
          (sourceUrl ? '<a class="img-modal-link" href="' + escAttr(sourceUrl) + '" target="_blank" rel="noopener">원본 보기 ↗</a>' : '') +
        '</div>' +
      '</div>';
    document.body.appendChild(modal);
  };

  function escAttr(s) {
    return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 간단한 마크다운 → HTML 변환 (marked.js 없이)
  function simpleMarkdown(md) {
    var html = md
      // 코드 블록 (먼저 처리)
      .replace(/```[\w]*\n([\s\S]*?)```/g, function(_, code) {
        return '<pre><code>' + escHtml(code.trim()) + '</code></pre>';
      })
      // 제목
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      // 인용
      .replace(/^> (.+)$/gm, '<blockquote><p>$1</p></blockquote>')
      // HR
      .replace(/^---+$/gm, '<hr>')
      // 굵게/이탤릭
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      // 인라인 코드
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      // 순서없는 목록 — 줄 단위로 처리
      .replace(/((?:^[-*] .+\n?)+)/gm, function(block) {
        var items = block.trim().split('\n').map(function(l) {
          return '<li>' + l.replace(/^[-*] /, '') + '</li>';
        }).join('');
        return '<ul>' + items + '</ul>';
      })
      // 순서있는 목록
      .replace(/((?:^\d+\. .+\n?)+)/gm, function(block) {
        var items = block.trim().split('\n').map(function(l) {
          return '<li>' + l.replace(/^\d+\. /, '') + '</li>';
        }).join('');
        return '<ol>' + items + '</ol>';
      })
      // 빈 줄 → 단락 구분
      .replace(/\n{2,}/g, '\n\n');

    // 단락 감싸기 (h1~h6, pre, ul, ol, hr, blockquote 제외)
    var lines = html.split('\n\n');
    html = lines.map(function(block) {
      if (!block.trim()) return '';
      if (/^<(h[1-6]|pre|ul|ol|hr|blockquote)/.test(block.trim())) return block;
      return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');

    return html;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderClaims(claims) {
    var wrap = document.createElement('div');
    wrap.className = 'wiki-claims-wrap';

    var header = document.createElement('div');
    header.className = 'wiki-claims-header';
    header.innerHTML = '<span class="wiki-claims-title">주요 주장</span>'
      + '<span class="wiki-claims-count">' + claims.length + '건</span>';
    wrap.appendChild(header);

    if (!claims.length) {
      var empty = document.createElement('div');
      empty.className = 'wiki-placeholder';
      empty.textContent = '수집된 주장이 없습니다';
      wrap.appendChild(empty);
      return wrap;
    }

    var CONF_CLASS = { high: 'conf-high', medium: 'conf-med', low: 'conf-low' };
    var CONF_LABEL = { high: '높음', medium: '보통', low: '낮음' };
    var KIND_LABEL = { factual: '사실', fact: '사실', analytical: '분석', opinion: '의견', contextual: '맥락' };

    claims.forEach(function(c) {
      var conf = c.confidence || 'medium';
      var card = document.createElement('div');
      card.className = 'wiki-claim-card';

      var dot = document.createElement('div');
      dot.className = 'wiki-claim-dot ' + (CONF_CLASS[conf] || 'conf-med');

      var body = document.createElement('div');
      body.className = 'wiki-claim-body';

      var text = document.createElement('div');
      text.className = 'wiki-claim-text';
      text.textContent = c.claim || '';
      body.appendChild(text);

      if (c.evidence && c.evidence !== 'n/a' && c.evidence !== '') {
        var ev = document.createElement('div');
        ev.className = 'wiki-claim-evidence';
        ev.textContent = c.evidence;
        body.appendChild(ev);
      }

      var meta = document.createElement('div');
      meta.className = 'wiki-claim-meta';
      if (c.kind) {
        var k = document.createElement('span');
        k.className = 'wiki-claim-tag tag-kind';
        k.textContent = KIND_LABEL[c.kind] || c.kind;
        meta.appendChild(k);
      }
      var cf = document.createElement('span');
      cf.className = 'wiki-claim-tag tag-' + conf;
      cf.textContent = CONF_LABEL[conf] || conf;
      meta.appendChild(cf);
      if (c.status === 'verified') {
        var st = document.createElement('span');
        st.className = 'wiki-claim-tag tag-verified';
        st.textContent = '검증됨';
        meta.appendChild(st);
      }
      body.appendChild(meta);

      card.appendChild(dot);
      card.appendChild(body);

      // 관련 이미지 썸네일 (매칭되는 이미지가 있을 때만)
      var matched = findMatchingImages(c.claim || '', 1);
      if (matched.length) {
        var img = matched[0];
        var thumbWrap = document.createElement('div');
        thumbWrap.className = 'claim-thumb-wrap';
        thumbWrap.title = img.title || '';
        thumbWrap.innerHTML =
          '<img class="claim-thumb" src="' + escAttr(img.image_url) + '" loading="lazy" ' +
               'onerror="this.closest(\'.claim-thumb-wrap\').style.display=\'none\'" ' +
               'onclick="openImgModal(\'' + escAttr(img.image_url) + '\',\'' + escAttr(img.title||'') + '\',\'' + escAttr(img.source_url||'') + '\')">';
        card.appendChild(thumbWrap);
      }

      wrap.appendChild(card);
    });

    return wrap;
  }
  // 📊 수집 자료 — sources를 카드 리스트로, claim 승격된 source는 하이라이트
  function loadResearchDataView() {
    content.innerHTML = '<div class="wiki-placeholder">수집 자료 로딩 중...</div>';
    fetch('/api/p/' + encodeURIComponent(slug) + '/research/canvas')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var sources = d.sources || [];
        var totalSources = d.total_sources || sources.length;
        var allClaims = [];
        var groupedClaims = d.claims || {};
        Object.keys(groupedClaims).forEach(function(k) {
          var arr = groupedClaims[k];
          if (Array.isArray(arr)) allClaims = allClaims.concat(arr);
        });

        // source_id → claims 매핑
        var claimsBySource = {};
        allClaims.forEach(function(c) {
          var sids = [];
          // 다양한 형식 대응 (claim.source_ids, claim.evidence.source_id 등)
          if (Array.isArray(c.source_ids)) sids = sids.concat(c.source_ids);
          if (c.source_id) sids.push(c.source_id);
          if (c.evidence && c.evidence.source_id) sids.push(c.evidence.source_id);
          sids.forEach(function(sid) {
            if (!sid) return;
            if (!claimsBySource[sid]) claimsBySource[sid] = [];
            claimsBySource[sid].push(c);
          });
        });

        content.innerHTML = '';
        var wrap = document.createElement('div');
        wrap.style.cssText = 'padding:16px';

        // 헤더
        var header = document.createElement('div');
        header.style.cssText = 'display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08)';
        var promotedCount = sources.filter(function(s) { return claimsBySource[s.source_id]; }).length;
        header.innerHTML =
          '<span style="font-size:16px;font-weight:700;color:#F4F4F5">📊 수집 자료</span>' +
          '<span style="font-size:11px;color:var(--text-muted);background:rgba(255,255,255,0.07);padding:2px 9px;border-radius:10px">' + totalSources + '건</span>' +
          (promotedCount ? '<span style="font-size:11px;color:#FCD34D;background:rgba(245,158,11,0.12);padding:2px 9px;border-radius:10px">✨ 클레임 승격 ' + promotedCount + '건</span>' : '') +
          '<span style="margin-left:auto;font-size:10px;color:var(--text-muted)">표시: ' + sources.length + ' / ' + totalSources + '</span>';
        wrap.appendChild(header);

        if (!sources.length) {
          var empty = document.createElement('div');
          empty.className = 'wiki-placeholder';
          empty.textContent = '수집된 자료가 아직 없습니다';
          wrap.appendChild(empty);
          content.appendChild(wrap);
          return;
        }

        // tier별 그룹핑
        var tierGroups = { A: [], B: [], unknown: [], C: [] };
        sources.forEach(function(s) {
          var t = s.tier_hint || 'unknown';
          if (!tierGroups[t]) tierGroups[t] = [];
          tierGroups[t].push(s);
        });

        var TIER_LABEL = {
          A: { name: 'Tier A — 위키/공식/언론', color: '#34D399' },
          B: { name: 'Tier B — 학술/도서/1차 사료', color: '#60A5FA' },
          unknown: { name: 'Tier unknown — 도메인 미분류', color: '#9CA3AF' },
          C: { name: 'Tier C — 블로그/SNS (참고용만)', color: '#F87171' }
        };

        ['A', 'B', 'unknown', 'C'].forEach(function(tier) {
          var items = tierGroups[tier];
          if (!items || !items.length) return;
          var info = TIER_LABEL[tier];

          var section = document.createElement('div');
          section.style.cssText = 'margin-bottom:24px';
          var stitle = document.createElement('div');
          stitle.style.cssText = 'font-size:12px;font-weight:600;color:' + info.color + ';margin-bottom:8px;letter-spacing:0.3px';
          stitle.textContent = info.name + ' (' + items.length + ')';
          section.appendChild(stitle);

          items.forEach(function(s) {
            var promoted = claimsBySource[s.source_id];
            var card = document.createElement('div');
            card.style.cssText =
              'border:1px solid ' + (promoted ? 'rgba(245,158,11,0.4)' : 'rgba(255,255,255,0.08)') + ';' +
              'background:' + (promoted ? 'rgba(245,158,11,0.06)' : 'rgba(255,255,255,0.02)') + ';' +
              'border-radius:6px;padding:10px 12px;margin-bottom:6px';

            var topLine = document.createElement('div');
            topLine.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap';

            var title = document.createElement('a');
            title.href = s.url || '#';
            title.target = '_blank';
            title.rel = 'noopener';
            title.style.cssText = 'font-size:13px;color:#E4E4E7;text-decoration:none;flex:1;font-weight:500';
            title.textContent = s.title || s.source_id || '(제목 없음)';
            topLine.appendChild(title);

            if (s.lane) {
              var lane = document.createElement('span');
              lane.style.cssText = 'font-size:9px;color:#A1A1AA;background:rgba(255,255,255,0.05);padding:2px 6px;border-radius:3px;font-family:monospace';
              lane.textContent = s.lane;
              topLine.appendChild(lane);
            }

            if (promoted) {
              var badge = document.createElement('span');
              badge.style.cssText = 'font-size:10px;color:#FCD34D;background:rgba(245,158,11,0.15);padding:2px 8px;border-radius:10px;font-weight:600';
              badge.textContent = '✨ 클레임 ' + promoted.length + '건';
              topLine.appendChild(badge);
            }
            card.appendChild(topLine);

            // 메타 라인 (publisher, date)
            var metaParts = [];
            if (s.publisher) metaParts.push(s.publisher);
            if (s.published_at) metaParts.push(s.published_at);
            if (s.url) metaParts.push(s.url.replace(/^https?:\/\//, '').split('/')[0]);
            if (metaParts.length) {
              var meta = document.createElement('div');
              meta.style.cssText = 'font-size:10px;color:#71717A;margin-top:3px';
              meta.textContent = metaParts.join(' · ');
              card.appendChild(meta);
            }

            // snippet
            if (s.snippet) {
              var snip = document.createElement('div');
              snip.style.cssText = 'font-size:11px;color:#A1A1AA;margin-top:6px;line-height:1.5';
              snip.textContent = s.snippet.length > 200 ? s.snippet.substring(0, 200) + '...' : s.snippet;
              card.appendChild(snip);
            }

            // 승격된 claim 미리보기 (최대 2건)
            if (promoted && promoted.length) {
              var claimList = document.createElement('div');
              claimList.style.cssText = 'margin-top:8px;padding-top:8px;border-top:1px dashed rgba(245,158,11,0.2)';
              promoted.slice(0, 2).forEach(function(c) {
                var line = document.createElement('div');
                line.style.cssText = 'font-size:11px;color:#FBBF24;margin-top:3px;line-height:1.4';
                line.textContent = '✨ ' + (c.claim || c.statement || '(클레임 텍스트 없음)');
                claimList.appendChild(line);
              });
              if (promoted.length > 2) {
                var more = document.createElement('div');
                more.style.cssText = 'font-size:10px;color:#A1A1AA;margin-top:3px';
                more.textContent = '+ ' + (promoted.length - 2) + '건 더';
                claimList.appendChild(more);
              }
              card.appendChild(claimList);
            }

            section.appendChild(card);
          });

          wrap.appendChild(section);
        });

        content.appendChild(wrap);
      })
      .catch(function(err) {
        content.innerHTML = '<div class="wiki-placeholder">수집 자료 로드 실패: ' + err + '</div>';
      });
  }

  function loadTargetedClaimsView() {
    content.innerHTML = '<div class="wiki-placeholder">타겟 리서치 데이터 로딩 중...</div>';
    fetch('/api/p/' + encodeURIComponent(slug) + '/research/canvas')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var tcs = d.targeted_claims || [];
        var rqs = d.research_questions || [];
        if (!tcs.length && !rqs.length) {
          content.innerHTML = '<div class="wiki-placeholder">리서치 데이터가 없습니다.<br><small>파이프라인을 실행하면 자동 수집됩니다.</small></div>';
          return;
        }
        var qMap = {};
        rqs.forEach(function(q) { qMap[q.id] = q; });

        var html = '<div class="tc-view">';
        html += '<div class="tc-header">타겟 리서치 Q&A <span class="tc-count">' + tcs.length + '개</span></div>';
        tcs.forEach(function(tc) {
          var q = qMap[tc.question_id] || {};
          var priority = q.priority || '';
          var pClass = priority === 'high' ? 'high' : priority === 'medium' ? 'medium' : 'low';
          html += '<div class="tc-card">';
          html += '<div class="tc-q">';
          if (priority) html += '<span class="wiki-claim-tag tag-' + pClass + '" style="margin-right:6px">' + priority + '</span>';
          html += '<span class="tc-q-text">' + escStr(tc.question || q.question || '') + '</span></div>';
          html += '<div class="tc-a">' + escStr(tc.answer || '') + '</div>';
          if (tc.sources && tc.sources.length) {
            html += '<div class="tc-src">출처: ' + tc.sources.slice(0,3).map(escStr).join(' · ') + '</div>';
          }
          html += '</div>';
        });
        html += '</div>';
        content.innerHTML = html;
      })
      .catch(function() {
        content.innerHTML = '<div class="wiki-placeholder">데이터 로드 실패</div>';
      });
  }

  function escStr(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

})();
</script>

<style>
.tc-view { padding: 20px 24px; max-width: 820px; }
.tc-header { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 16px; }
.tc-count { background: rgba(245,158,11,.15); color: #FCD34D; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 6px; }
.tc-card { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.tc-q { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 8px; }
.tc-q-text { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.5; }
.tc-a { font-size: 13px; color: #D4D4D8; line-height: 1.7; border-left: 2px solid rgba(245,158,11,.4); padding-left: 10px; }
.tc-src { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
</style>

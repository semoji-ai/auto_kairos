<!-- Research + Manuscript 2패널 캔버스 -->
<div class="rc-wrap" id="rc-wrap" data-slug="{{ slug }}">

  <!-- ── 2패널 메인 ── -->
  <div class="rc-panels">

    <!-- 왼쪽: Research Canvas -->
    <div class="rc-panel rc-panel-research" id="rc-research-panel">
      <div class="rc-panel-header">
        <span class="rc-panel-title">Research Canvas</span>
        <span class="rc-claim-count" id="rc-claim-count">— claims</span>
        <span class="rc-live-dot" id="rc-live-dot" title="실시간 스트리밍"></span>
      </div>
      <div class="rc-panel-body" id="rc-claims-body">
        <div class="rc-empty">리서치 데이터를 불러오는 중...</div>
      </div>
    </div>

    <!-- 오른쪽: Manuscript Canvas -->
    <div class="rc-panel rc-panel-manuscript" id="rc-manuscript-panel">
      <div class="rc-panel-header">
        <span class="rc-panel-title">Manuscript Canvas</span>
        <span class="rc-ms-badge" id="rc-ms-badge">—</span>
      </div>
      <div class="rc-panel-body" id="rc-ms-body">
        <div class="rc-empty">원고 데이터를 불러오는 중...</div>
      </div>
    </div>

  </div>
</div>

<style>
/* ── 전체 레이아웃 ── */
.rc-wrap {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 80px);
  overflow: hidden;
}

/* ── 2패널 ── */
.rc-panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  flex: 1;
  overflow: hidden;
}

.rc-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--border);
}
.rc-panel:last-child { border-right: none; }

.rc-panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.rc-panel-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}
.rc-claim-count {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--surface2);
  padding: 2px 8px;
  border-radius: 8px;
}
.rc-live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border);
  margin-left: auto;
  transition: background 0.3s;
}
.rc-live-dot.streaming {
  background: #22c55e;
  box-shadow: 0 0 6px #22c55e88;
  animation: pulse-dot 1.5s infinite;
}
@keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.rc-ms-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 8px;
  background: var(--surface2);
  color: var(--text-muted);
}
.rc-ms-badge.draft { background: rgba(59,130,246,0.15); color: #93C5FD; }
.rc-ms-badge.final { background: rgba(34,197,94,0.15); color: #86EFAC; }

.rc-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

/* ── Chapter Section (Research) ── */
.rc-ch-section { margin-bottom: 28px; }
.rc-ch-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  padding: 6px 0 8px;
  border-bottom: 1px solid rgba(245,158,11,0.2);
  margin-bottom: 10px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 1;
}

/* ── Chapter Purpose ── */
.rc-ch-purpose {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
  line-height: 1.5;
  opacity: 0.7;
}

/* ── Research Focus Questions ── */
.rc-focus-wrap {
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.rc-focus-q {
  font-size: 11px;
  color: rgba(245,158,11,0.55);
  padding: 3px 8px;
  border-left: 2px solid rgba(245,158,11,0.2);
  background: rgba(245,158,11,0.04);
  border-radius: 0 4px 4px 0;
  line-height: 1.5;
}

/* ── Claims Wrap & Waiting ── */
.rc-claims-wrap { min-height: 24px; }
.rc-ch-waiting {
  font-size: 11px;
  color: var(--text-muted);
  padding: 6px 0;
  opacity: 0.5;
}

/* ── Claim Card ── */
.rc-claim {
  display: flex;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  animation: claim-in 0.3s ease;
}
@keyframes claim-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.rc-claim:last-child { border-bottom: none; }

.rc-claim-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-top: 7px;
  flex-shrink: 0;
}
.rc-claim-dot.high   { background: #22c55e; }
.rc-claim-dot.medium { background: #f59e0b; }
.rc-claim-dot.low    { background: #6b7280; }

.rc-claim-body { flex: 1; min-width: 0; }
.rc-claim-text {
  font-size: 13px;
  line-height: 1.6;
  color: #D4D4D8;
  word-break: keep-all;
}
.rc-claim-meta {
  display: flex;
  gap: 6px;
  margin-top: 4px;
  flex-wrap: wrap;
}
.rc-tag {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 500;
}
.rc-tag-kind     { background: rgba(99,102,241,0.15); color: #A5B4FC; }
.rc-tag-high     { background: rgba(34,197,94,0.12); color: #86EFAC; }
.rc-tag-medium   { background: rgba(245,158,11,0.12); color: #FCD34D; }
.rc-tag-low      { background: rgba(107,114,128,0.15); color: #9CA3AF; }
.rc-tag-verified { background: rgba(34,197,94,0.08); color: #6EE7B7; }

/* ── Manuscript Canvas ── */
.rc-ms-chapter {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  margin: 24px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(245,158,11,0.2);
}
.rc-ms-chapter:first-child { margin-top: 0; }
.rc-ms-paragraph {
  font-size: 14px;
  line-height: 1.85;
  color: #D4D4D8;
  margin-bottom: 14px;
  word-break: keep-all;
}
.rc-ms-divider {
  border: none;
  border-top: 1px dashed rgba(255,255,255,0.1);
  margin: 12px 0;
}

/* ── Empty ── */
.rc-empty {
  font-size: 13px;
  color: var(--text-muted);
  padding: 20px 0;
  text-align: center;
}

/* ── Responsive ── */
@media (max-width: 900px) {
  .rc-panels { grid-template-columns: 1fr; }
  .rc-wrap { height: auto; }
}
</style>

<script>
(function() {
  var slug = document.getElementById('rc-wrap').dataset.slug;
  var claimsBody = document.getElementById('rc-claims-body');
  var msBody = document.getElementById('rc-ms-body');
  var countEl = document.getElementById('rc-claim-count');
  var liveDot = document.getElementById('rc-live-dot');
  var msBadge = document.getElementById('rc-ms-badge');

  var chapterMap = {};
  var chapterDetails = {};  // chapter_number → {title, purpose, research_focus}
  var claimsByChapter = {};
  var totalClaims = 0;

  // ── 1. outline + claims 초기 로드 ──
  fetch('/api/p/' + slug + '/research/canvas')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      chapterMap = d.chapter_map || {};
      claimsByChapter = d.grouped_claims || {};
      totalClaims = d.total_claims || 0;

      // 챕터 상세 정보 저장 (research_focus 포함)
      var chapters = d.chapters || [];
      chapters.forEach(function(ch) {
        var num = ch.chapter_number || ch.id || 0;
        chapterDetails[String(num)] = ch;
      });

      renderOutlineFirst(chapters);
      countEl.textContent = totalClaims + ' claims';
    })
    .catch(function() {
      claimsBody.innerHTML = '<div class="rc-empty">리서치 데이터가 없습니다</div>';
    });

  // ── 2. 원고 로드 (final → draft 순) ──
  fetch('/api/p/' + slug + '/manuscript/raw')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.text && d.text.trim()) {
        renderManuscript(d.text);
        msBadge.textContent = '최종원고';
        msBadge.className = 'rc-ms-badge final';
      } else {
        fetchDraft();
      }
    })
    .catch(function() { fetchDraft(); });

  function fetchDraft() {
    // draft.md는 별도 엔드포인트 없으므로 pipeline status로 확인
    msBody.innerHTML = '<div class="rc-empty">원고 준비 중</div>';
    msBadge.textContent = '대기중';
    msBadge.className = 'rc-ms-badge';
  }

  // ── Outline-first 렌더링 ──
  function renderOutlineFirst(chapters) {
    claimsBody.innerHTML = '';

    if (!chapters || !chapters.length) {
      // outline 없으면 기존 claims-only 렌더
      renderClaimsOnly();
      return;
    }

    chapters.forEach(function(ch) {
      var num = String(ch.chapter_number || ch.id || '');
      claimsBody.appendChild(buildChapterSection(num, claimsByChapter[num] || [], ch));
    });

    // unassigned claims
    if (claimsByChapter['unassigned'] && claimsByChapter['unassigned'].length) {
      claimsBody.appendChild(buildChapterSection('unassigned', claimsByChapter['unassigned'], null));
    }
  }

  function renderClaimsOnly() {
    if (!Object.keys(claimsByChapter).length) {
      claimsBody.innerHTML = '<div class="rc-empty">아웃라인이 생성되면 여기에 표시됩니다</div>';
      return;
    }
    var keys = Object.keys(claimsByChapter).sort(function(a, b) {
      return (parseInt(a) || 999) - (parseInt(b) || 999);
    });
    keys.forEach(function(chId) {
      var claims = claimsByChapter[chId];
      if (!claims || !claims.length) return;
      claimsBody.appendChild(buildChapterSection(chId, claims, null));
    });
  }

  function buildChapterSection(chId, claims, chData) {
    var section = document.createElement('div');
    section.className = 'rc-ch-section';
    section.id = 'rc-ch-' + chId;

    // 챕터 헤더
    var chTitle = (chData && chData.title) || chapterMap[chId] || chapterMap[parseInt(chId)] || '';
    var titleEl = document.createElement('div');
    titleEl.className = 'rc-ch-title';
    titleEl.textContent = chId !== 'unassigned'
      ? (chTitle ? ('Ch' + chId + '. ' + chTitle) : ('Chapter ' + chId))
      : '미분류';
    section.appendChild(titleEl);

    // purpose
    if (chData && chData.purpose) {
      var purposeEl = document.createElement('div');
      purposeEl.className = 'rc-ch-purpose';
      purposeEl.textContent = chData.purpose;
      section.appendChild(purposeEl);
    }

    // research_focus 질문 (claims 없을 때 placeholder로)
    var focus = (chData && chData.research_focus) || [];
    if (focus.length && !claims.length) {
      var focusWrap = document.createElement('div');
      focusWrap.className = 'rc-focus-wrap';
      focus.forEach(function(q) {
        var qEl = document.createElement('div');
        qEl.className = 'rc-focus-q';
        qEl.textContent = '? ' + q;
        focusWrap.appendChild(qEl);
      });
      section.appendChild(focusWrap);
    }

    // claims
    var claimsWrap = document.createElement('div');
    claimsWrap.className = 'rc-claims-wrap';
    claimsWrap.id = 'rc-claims-' + chId;
    claims.forEach(function(c) {
      claimsWrap.appendChild(buildClaimCard(c));
    });
    if (!claims.length) {
      var waiting = document.createElement('div');
      waiting.className = 'rc-ch-waiting';
      waiting.textContent = '리서치 대기 중...';
      claimsWrap.appendChild(waiting);
    }
    section.appendChild(claimsWrap);

    return section;
  }

  function buildClaimCard(c) {
    var conf = c.confidence || 'medium';
    var dotClass = conf === 'high' ? 'high' : conf === 'medium' ? 'medium' : 'low';

    var card = document.createElement('div');
    card.className = 'rc-claim';

    var dot = document.createElement('div');
    dot.className = 'rc-claim-dot ' + dotClass;

    var body = document.createElement('div');
    body.className = 'rc-claim-body';

    var text = document.createElement('div');
    text.className = 'rc-claim-text';
    text.textContent = c.claim || '';

    var meta = document.createElement('div');
    meta.className = 'rc-claim-meta';

    if (c.kind) {
      var t1 = document.createElement('span');
      t1.className = 'rc-tag rc-tag-kind';
      t1.textContent = c.kind;
      meta.appendChild(t1);
    }
    var t2 = document.createElement('span');
    t2.className = 'rc-tag rc-tag-' + dotClass;
    t2.textContent = conf;
    meta.appendChild(t2);

    if (c.status === 'verified') {
      var t3 = document.createElement('span');
      t3.className = 'rc-tag rc-tag-verified';
      t3.textContent = '✓';
      meta.appendChild(t3);
    }

    body.appendChild(text);
    body.appendChild(meta);
    card.appendChild(dot);
    card.appendChild(body);
    return card;
  }

  // ── Manuscript 렌더링 ──
  function renderManuscript(text) {
    msBody.innerHTML = '';
    var lines = text.split('\n');
    var currentPara = [];

    function flushPara() {
      if (!currentPara.length) return;
      var joined = currentPara.join(' ').trim();
      if (!joined) { currentPara = []; return; }
      var p = document.createElement('div');
      p.className = 'rc-ms-paragraph';
      p.textContent = joined;
      msBody.appendChild(p);
      currentPara = [];
    }

    lines.forEach(function(line) {
      if (/^#\s+(Ch\d+|챕터\s*\d+)/i.test(line)) {
        flushPara();
        var h = document.createElement('div');
        h.className = 'rc-ms-chapter';
        h.textContent = line.replace(/^#+\s*/, '');
        msBody.appendChild(h);
      } else if (line.trim() === '---') {
        flushPara();
        var hr = document.createElement('hr');
        hr.className = 'rc-ms-divider';
        msBody.appendChild(hr);
      } else if (line.trim().startsWith('<!--')) {
        // chars 주석 스킵
      } else if (line.trim() === '') {
        flushPara();
      } else {
        currentPara.push(line.trim());
      }
    });
    flushPara();
  }

  // ── 3. SSE: claims 실시간 ──
  var claimsEv = registerSse(new EventSource('/api/p/' + slug + '/pipeline/research/claims/stream'));

  claimsEv.addEventListener('claims_snapshot', function(e) {
    try {
      var d = JSON.parse(e.data);
      if (d.total > totalClaims) {
        totalClaims = d.total;
        countEl.textContent = totalClaims + ' claims';
      }
    } catch(err) {}
  });

  claimsEv.addEventListener('claims_new', function(e) {
    try {
      var d = JSON.parse(e.data);
      var newClaims = d.claims || [];
      if (!newClaims.length) return;

      liveDot.classList.add('streaming');
      setTimeout(function() { liveDot.classList.remove('streaming'); }, 2000);
      totalClaims += newClaims.length;
      countEl.textContent = totalClaims + ' claims';

      newClaims.forEach(function(c) {
        var chId = String(c.chapter || 'unassigned');
        var claimsWrap = document.getElementById('rc-claims-' + chId);
        if (!claimsWrap) {
          // 챕터 섹션 자체가 없으면 새로 생성
          var section = buildChapterSection(chId, [], chapterDetails[chId] || null);
          claimsBody.appendChild(section);
          claimsWrap = document.getElementById('rc-claims-' + chId);
        }
        // "대기 중" 메시지 제거
        var waiting = claimsWrap.querySelector('.rc-ch-waiting');
        if (waiting) waiting.remove();
        claimsWrap.appendChild(buildClaimCard(c));
      });
    } catch(err) {}
  });

  // ── 4. SSE: 원고 업데이트 ──
  var msEv = registerSse(new EventSource('/api/p/' + slug + '/pipeline/stream'));

  msEv.addEventListener('manuscript_updated', function(e) {
    try {
      var d = JSON.parse(e.data);
      if (d.text) {
        renderManuscript(d.text);
        msBadge.textContent = '최종원고';
        msBadge.className = 'rc-ms-badge final';
      }
    } catch(err) {}
  });

  msEv.addEventListener('draft_updated', function(e) {
    try {
      var d = JSON.parse(e.data);
      if (d.text) {
        renderManuscript(d.text);
        msBadge.textContent = '초고';
        msBadge.className = 'rc-ms-badge draft';
      }
    } catch(err) {}
  });


})();
</script>

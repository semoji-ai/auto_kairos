<!-- Design System — 테마·컬러·애니메이션 프리셋 관리 -->
<div class="design-page">
  <div class="design-header">
    <h2>Design System</h2>
    <p class="design-desc">테마, 컬러, 애니메이션 설정을 프리셋으로 저장하고 프로젝트에 적용합니다.</p>
  </div>

  <!-- ── 프리셋 선택 바 ── -->
  <div class="design-topbar">
    <select id="preset-dropdown" class="preset-dropdown" onchange="window.selectPreset(this.value)">
      <option value="">프리셋 선택...</option>
    </select>
    <button class="btn-sm btn-accent" onclick="newPreset()">+ 새 프리셋</button>
  </div>

  <div class="design-layout">
    <!-- ── 좌: 편집 영역 ── -->
    <div class="design-editor">
      <div id="editor-area">
        <div class="editor-placeholder">
          <div class="placeholder-icon">🎨</div>
          <p>상단에서 프리셋을 선택하거나 새로 만드세요</p>
        </div>
      </div>
    </div>

    <!-- ── 우: 프리뷰 ── -->
    <div class="design-preview">
      <div class="design-preview-header">
        <h3>Preview</h3>
      </div>
      <iframe id="preview-iframe" src="/static/preview/index.html" style="width:100%;height:100%;border:none;border-radius:0 0 8px 8px;background:#000;"></iframe>
    </div>
  </div>
</div>

<style>
.design-page { padding: 20px 24px; }
.design-header h2 { margin: 0 0 4px; font-size: 18px; }
.design-desc { color: var(--text-muted); font-size: 12px; margin: 0 0 16px; }

/* 프리셋 드롭다운 바 */
.design-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.preset-dropdown {
  flex: 1; max-width: 360px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px; color: #E4E4E7; font-size: 13px; padding: 8px 12px; outline: none; cursor: pointer;
}
.preset-dropdown:focus { border-color: rgba(245,158,11,0.4); }

.design-layout { display: flex; gap: 16px; height: calc(90vh - 180px); }

/* 편집 영역 */
.design-editor { flex: 0 0 400px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; overflow-y: auto; }

/* 프리뷰 패널 */
.design-preview { flex: 1; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; min-width: 480px; }
.design-preview-header { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.design-preview-header h3 { margin: 0; font-size: 13px; }

.editor-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); }
.placeholder-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }

/* 편집 폼 */
.design-form { padding: 16px 20px; }
.design-form-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.design-form-header h3 { margin: 0; font-size: 15px; }
.design-form-actions { display: flex; gap: 6px; }

.form-section { margin-bottom: 20px; }
.form-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent, #F59E0B); margin-bottom: 10px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-group { display: flex; flex-direction: column; gap: 3px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 10px; color: var(--text-muted); }
.form-input, .form-select {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px; color: #E4E4E7; font-size: 12px; padding: 6px 8px; outline: none;
  width: 100%; box-sizing: border-box;
}
.form-select { cursor: pointer; }
.form-input:focus, .form-select:focus { border-color: rgba(245,158,11,0.4); }
.form-input[type="color"] { height: 32px; padding: 2px 4px; cursor: pointer; }
.form-input[type="range"] { accent-color: var(--accent, #F59E0B); }

/* 프리뷰 그리드 */
.preview-section { margin-top: 16px; }
.preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.preview-chip {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px; padding: 10px; text-align: center; font-size: 11px;
}
.preview-chip-label { font-size: 9px; color: var(--text-muted); margin-top: 4px; }
.preview-swatch { width: 100%; height: 28px; border-radius: 4px; margin-bottom: 4px; }

/* 버튼 */
.btn-sm { font-size: 11px; padding: 4px 10px; border-radius: 4px; cursor: pointer; border: none; }
.btn-accent { background: var(--accent, #F59E0B); color: #000; font-weight: 600; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #ccc; }
.btn-outline:hover { background: rgba(255,255,255,0.05); }
.btn-danger { background: rgba(239,68,68,0.15); color: #EF4444; border: 1px solid rgba(239,68,68,0.2); }
.btn-apply { background: #22C55E; color: #000; font-weight: 600; }

.status-msg { font-size: 11px; text-align: center; margin-top: 8px; }
.status-ok { color: #22C55E; }
.status-err { color: #EF4444; }
</style>

<script>
(function() {
  var SLUG = '{{ slug }}';
  var DIR_NAME = '{{ dir_name|default(slug) }}';
  var _presets = [];
  var _activeId = null;

  function _esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function _v(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function _def(val, fallback) { return (val !== null && val !== undefined) ? val : fallback; }

  // ── 프리셋 목록 로드 ──
  window.loadPresets = function() {
    fetch('/api/design-presets')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        _presets = data.presets || [];
        _renderPresetList();
      })
      .catch(function(e) { console.error('preset load error', e); });
  };

  function _renderPresetList() {
    var dd = document.getElementById('preset-dropdown');
    if (!dd) return;
    var html = '<option value="">프리셋 선택...</option>';
    _presets.forEach(function(p) {
      var sel = p._id === _activeId ? ' selected' : '';
      var tag = p.builtin ? ' [내장]' : '';
      html += '<option value="' + p._id + '"' + sel + '>' + _esc(p.name) + tag + '</option>';
    });
    dd.innerHTML = html;
  }

  // ── 프리셋 선택 ──
  window.selectPreset = function(id) {
    _activeId = id;
    _renderPresetList();
    var p = _presets.find(function(x) { return x._id === id; });
    if (p) _renderEditor(p);
  };

  // ── 새 프리셋 ──
  window.newPreset = function() {
    _activeId = null;
    _renderPresetList();
    _renderEditor({
      _id: null, name: '', description: '', builtin: false,
      global: { videoTheme: 'dark', artStyle: '', accentColor: '#F59E0B', vizFont: 'Pretendard' },
      defaults: { mood: 'dramatic', reveal: 'stagger', emphasis: 'keyword', layout: '' },
      animation: { stagger: 8, itemDuration: 20, easing: 'easeOut', titleFadeIn: 15 },
    });
  };

  // ── 편집 폼 렌더 ──
  function _renderEditor(p) {
    var g = p.global || {};
    var d = p.defaults || {};
    var a = p.animation || {};
    var ro = !!p.builtin;  // readonly for builtin

    var html = '<div class="design-form">'
      + '<div class="design-form-header">'
      + '<h3>' + (p.name ? _esc(p.name) : '새 프리셋') + '</h3>'
      + '<div class="design-form-actions">';

    if (ro) {
      html += '<button class="btn-sm btn-outline" id="btn-fork">복제하여 편집</button>';
    } else {
      html += '<button class="btn-sm btn-accent" id="btn-save">저장</button>';
      if (p._id) html += '<button class="btn-sm btn-danger" id="btn-del" data-pid="' + p._id + '">삭제</button>';
    }
    html += '<button class="btn-sm btn-apply" id="btn-apply" data-pid="' + (p._id || '') + '">프로젝트 적용</button>';
    html += '</div></div>';

    // 이름/설명
    html += '<div class="form-section">'
      + '<div class="form-section-title">기본 정보</div>'
      + '<div class="form-grid">'
      + _fmtInput('preset-name', '프리셋 이름', p.name || '', ro)
      + _fmtInput('preset-desc', '설명', p.description || '', ro, 'full')
      + '</div></div>';

    // 글로벌 설정
    html += '<div class="form-section">'
      + '<div class="form-section-title">글로벌 설정</div>'
      + '<div class="form-grid">'
      + _fmtSelect('g-theme', '테마', g.videoTheme || 'dark', [['dark','Dark'],['white','White']], ro)
      + _fmtSelect('g-artStyle', '아트스타일', g.artStyle || '', [['','없음'],['semoji','Semoji'],['lego','Lego'],['quirky_cartoon','Quirky Cartoon'],['stickman_cute','Stickman Cute']], ro)
      + _fmtColor('g-accent', '액센트 색상', g.accentColor || '#F59E0B', ro)
      + _fmtInput('g-font', '시각화 폰트', g.vizFont || 'Pretendard', ro)
      + '</div></div>';

    // 씬 기본값, 애니메이션은 씬별 고유 설정 — 디자인 프리셋에서 제외

    // ── 디자인 프리셋 (확장) ──
    var dp = p.designPreset || {};
    var dpC = dp.colors || {};
    var dpF = dp.fonts || {};
    var dpT = dp.typography || {};
    var dpL = dp.layout || {};
    var dpM = dp.map || {};
    var dpS = dp.subtitle || {};

    // 컬러 팔레트
    html += '<div class="form-section">'
      + '<div class="form-section-title">컬러 팔레트</div>'
      + '<div class="form-grid">'
      + _fmtColor('dp-bg', '배경', dpC.bg || '#0A0A0A', ro)
      + _fmtColor('dp-text', '텍스트', dpC.text || '#FFFFFF', ro)
      + _fmtColor('dp-accent', 'Accent', dpC.accent || g.accentColor || '#F59E0B', ro)
      + _fmtColor('dp-positive', 'Positive', dpC.positive || '#22C55E', ro)
      + _fmtColor('dp-negative', 'Negative', dpC.negative || '#EF4444', ro)
      + _fmtColor('dp-warning', 'Warning', dpC.warning || '#F59E0B', ro)
      + _fmtColor('dp-rank1', '1등', (dpC.rank && dpC.rank[0]) || '#FFD700', ro)
      + _fmtColor('dp-rank2', '2등', (dpC.rank && dpC.rank[1]) || '#C0C0C0', ro)
      + _fmtColor('dp-rank3', '3등', (dpC.rank && dpC.rank[2]) || '#CD7F32', ro)
      + '</div></div>';

    // 폰트
    var fontOpts = [['Pretendard','Pretendard'],['SBAggroB','SB AggroB'],['GriunPolFairness','GriunPolFairness']];
    html += '<div class="form-section">'
      + '<div class="form-section-title">폰트</div>'
      + '<div class="form-grid">'
      + _fmtSelect('dp-bodyFont', '본문 폰트', (dpF.body && dpF.body.family) || 'Pretendard', fontOpts, ro)
      + _fmtSelect('dp-titleFont', '제목 폰트', (dpF.title && dpF.title.family) || '', [['','본문과 동일']].concat(fontOpts), ro)
      + _fmtInput('dp-quoteFont', '인용부호 폰트', (dpF.quote && dpF.quote.family) || 'Georgia, serif', ro)
      + '</div></div>';

    // 타이포그래피
    html += '<div class="form-section">'
      + '<div class="form-section-title">타이포그래피</div>'
      + '<div class="form-grid">'
      + _fmtRange('dp-headlineAccent', '헤드라인 Accent (px)', _def(dpT.headlineAccent, 80), 48, 120, 2, ro)
      + _fmtRange('dp-headlineBase', '헤드라인 Base (px)', _def(dpT.headlineBase, 48), 28, 80, 2, ro)
      + _fmtRange('dp-itemText', '아이템 텍스트 (px)', _def(dpT.itemText, 28), 16, 48, 1, ro)
      + _fmtRange('dp-sourceText', '출처 텍스트 (px)', _def(dpT.sourceText, 18), 10, 28, 1, ro)
      + _fmtRange('dp-chartTitle', '차트 제목 (px)', _def(dpT.chartTitle, 48), 28, 72, 2, ro)
      + _fmtRange('dp-quoteText', '인용문 (px)', _def(dpT.quoteText, 44), 24, 64, 2, ro)
      + '</div></div>';

    // 레이아웃
    html += '<div class="form-section">'
      + '<div class="form-section-title">레이아웃</div>'
      + '<div class="form-grid">'
      + _fmtRange('dp-cardRadius', '카드 둥글기 (px)', _def(dpL.cardRadius, 12), 0, 32, 1, ro)
      + _fmtRange('dp-gap', '기본 간격 (px)', _def(dpL.gap, 24), 8, 48, 2, ro)
      + _fmtRange('dp-itemsGap', '아이템 간격 (px)', _def(dpL.itemsGap, 16), 4, 32, 2, ro)
      + _fmtRange('dp-badgeSize', '배지 크기 (px)', _def(dpL.badgeSize, 48), 24, 80, 2, ro)
      + _fmtRange('dp-barHeight', '바 차트 높이 (px)', _def(dpL.barHeight, 32), 12, 48, 2, ro)
      + _fmtRange('dp-maxContent', '최대 콘텐츠 폭 (px)', _def(dpL.maxContentWidth, 1100), 600, 1600, 50, ro)
      + '</div></div>';

    // 맵 테마
    var mapThemes = [
      ['modern_clean','Modern Clean'],['minimal_light','Minimal Light'],['dark_elegant','Dark Elegant'],
      ['blueprint','Blueprint'],['warm_earth','Warm Earth'],['historical','Historical'],
      ['dark_cyber','Dark Cyber'],['vintage_parchment','Vintage Parchment'],
      ['clean_white','Clean White'],['matte_slate','Matte Slate']
    ];
    html += '<div class="form-section">'
      + '<div class="form-section-title">맵 설정</div>'
      + '<div class="form-grid">'
      + _fmtSelect('dp-mapTheme', '기본 맵 테마', dpM.defaultTheme || 'modern_clean', mapThemes, ro)
      + '</div></div>';

    // 자막 스타일
    html += '<div class="form-section">'
      + '<div class="form-section-title">자막 스타일</div>'
      + '<div class="form-grid">'
      + _fmtColor('dp-subKeyword', '키워드 색상', dpS.keywordColor || '#F7D94C', ro)
      + _fmtColor('dp-subStroke', '외곽선 색상', dpS.strokeColor || '#3D3B2F', ro)
      + _fmtRange('dp-subStrokeW', '외곽선 두께', _def(dpS.strokeWidth, 2), 0, 6, 0.5, ro)
      + _fmtRange('dp-subSize', '자막 크기 (px)', _def(dpS.fontSize, 44), 24, 64, 2, ro)
      + _fmtRange('dp-subBottom', '하단 오프셋 (px)', _def(dpS.bottomOffset, 30), 0, 120, 5, ro)
      + '</div></div>';

    // 컴포넌트 변형
    var dpV = (dp.variants) || {};
    var badgeShapes = [['circle','Circle'],['rounded-square','Rounded Square'],['square','Square']];
    var cardStyles = [['bordered','Bordered'],['filled','Filled'],['glass','Glass'],['minimal','Minimal']];
    var flagShapes = [['circle','Circle'],['card','Card'],['rounded-square','Rounded Sq']];
    var tagStyles = [['rounded','Rounded'],['pill','Pill'],['square','Square']];
    var connStyles = [['arrow','Arrow'],['line','Line'],['dashed','Dashed']];
    var divStyles = [['solid','Solid'],['dashed','Dashed'],['dotted','Dotted'],['gradient','Gradient']];
    var dotStyles = [['dot','Dot'],['icon','Icon'],['badge','Badge']];
    var barStyles = [['rounded','Rounded'],['flat','Flat'],['thick','Thick']];
    var quoteStyles = [['large','Large'],['small','Small'],['none','None']];
    var calloutStyles = [['left-border','Left Border'],['full-border','Full Border'],['highlight','Highlight']];
    var glowStyles = [['glow','Glow'],['solid','Solid'],['ring','Ring']];
    var sparkStyles = [['line','Line'],['area','Area']];
    var metricStyles = [['bordered','Bordered'],['filled','Filled'],['glass','Glass']];
    var compStyles = [['bordered','Bordered'],['filled','Filled'],['accent-top','Accent Top']];
    var stepShapes = [['circle','Circle'],['rounded-square','Rounded Sq']];
    var tlDotShapes = [['circle','Circle'],['diamond','Diamond'],['square','Square']];
    var rankShapes = [['circle','Circle'],['shield','Shield'],['square','Square']];
    var annoStyles = [['solid','Solid'],['dashed','Dashed']];
    var miniBarStyles = [['rounded','Rounded'],['flat','Flat']];
    var pillStyles = [['pill','Pill'],['rounded','Rounded'],['square','Square']];

    html += '<div class="form-section">'
      + '<div class="form-section-title">컴포넌트 변형</div>'
      + '<div class="form-grid">'
      + _fmtSelect('v-circleBadge', 'CircleBadge', dpV.circleBadge || 'circle', badgeShapes, ro)
      + _fmtSelect('v-iconBadge', 'IconBadge', dpV.iconBadge || 'circle', badgeShapes, ro)
      + _fmtSelect('v-imageBadge', 'ImageBadge', dpV.imageBadge || 'circle', badgeShapes, ro)
      + _fmtSelect('v-flagBadge', 'FlagBadge', dpV.flagBadge || 'circle', flagShapes, ro)
      + _fmtSelect('v-logoBadge', 'LogoBadge', dpV.logoBadge || 'circle', badgeShapes, ro)
      + _fmtSelect('v-rankBadge', 'RankBadge', dpV.rankBadge || 'circle', rankShapes, ro)
      + _fmtSelect('v-card', 'Card', dpV.card || 'bordered', cardStyles, ro)
      + _fmtSelect('v-metricCard', 'MetricCard', dpV.metricCard || 'bordered', metricStyles, ro)
      + _fmtSelect('v-comparisonCell', 'ComparisonCell', dpV.comparisonCell || 'bordered', compStyles, ro)
      + _fmtSelect('v-callout', 'Callout', dpV.callout || 'left-border', calloutStyles, ro)
      + _fmtSelect('v-tag', 'Tag', dpV.tag || 'rounded', tagStyles, ro)
      + _fmtSelect('v-pill', 'Pill', dpV.pill || 'pill', pillStyles, ro)
      + _fmtSelect('v-statusDot', 'StatusDot', dpV.statusDot || 'dot', dotStyles, ro)
      + _fmtSelect('v-progressBar', 'ProgressBar', dpV.progressBar || 'rounded', barStyles, ro)
      + _fmtSelect('v-miniBar', 'MiniBar', dpV.miniBar || 'rounded', miniBarStyles, ro)
      + _fmtSelect('v-connector', 'Connector', dpV.connector || 'arrow', connStyles, ro)
      + _fmtSelect('v-timelineDot', 'TimelineDot', dpV.timelineDot || 'circle', tlDotShapes, ro)
      + _fmtSelect('v-stepBadge', 'StepBadge', dpV.stepBadge || 'circle', stepShapes, ro)
      + _fmtSelect('v-quoteMark', 'QuoteMark', dpV.quoteMark || 'large', quoteStyles, ro)
      + _fmtSelect('v-divider', 'Divider', dpV.divider || 'solid', divStyles, ro)
      + _fmtSelect('v-glowDot', 'GlowDot', dpV.glowDot || 'glow', glowStyles, ro)
      + _fmtSelect('v-annotationLine', 'AnnotationLine', dpV.annotationLine || 'solid', annoStyles, ro)
      + _fmtSelect('v-sparkline', 'Sparkline', dpV.sparkline || 'line', sparkStyles, ro)
      + '</div></div>';

    // 프리뷰
    var accentHex = g.accentColor || '#F59E0B';
    var themeBg = g.videoTheme === 'white' ? '#FAFAFA' : '#0A0A0A';
    var themeFg = g.videoTheme === 'white' ? '#1A1A2E' : '#fff';
    html += '<div class="form-section preview-section">'
      + '<div class="form-section-title">프리뷰</div>'
      + '<div id="preview-grid" class="preview-grid">'
      + '<div class="preview-chip"><div class="preview-swatch" style="background:' + accentHex + '"></div>액센트<div class="preview-chip-label">' + _esc(accentHex) + '</div></div>'
      + '<div class="preview-chip"><div class="preview-swatch" style="background:' + themeBg + ';display:flex;align-items:center;justify-content:center;font-size:10px;color:' + themeFg + '">' + _esc(g.videoTheme || 'dark') + '</div>테마</div>'
      + '<div class="preview-chip"><div class="preview-swatch" style="background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:10px">' + _esc(d.mood || 'informative') + '</div>무드</div>'
      + '</div></div>';

    html += '<div id="design-status"></div>';
    html += '</div>';

    var area = document.getElementById('editor-area');
    if (area) area.innerHTML = html;

    // 버튼 이벤트 바인딩 (onclick 대신 addEventListener)
    _bind('btn-save', 'click', function() { window.savePreset(); });
    _bind('btn-del', 'click', function() { window.deletePreset(this.getAttribute('data-pid')); });
    _bind('btn-apply', 'click', function() { window.applyPreset(this.getAttribute('data-pid')); });
    _bind('btn-fork', 'click', function() { _forkBuiltin(p); });

    // 실시간 프리뷰 업데이트
    _bind('g-accent', 'input', _updatePreview);
    _bind('g-theme', 'change', function() {
      _applyThemeDefaults(_v('g-theme'));
      _updatePreview();
    });
    _bind('d-mood', 'change', _updatePreview);
    _bind('dp-bg', 'input', _updatePreview);
    _bind('dp-accent', 'input', _updatePreview);
    _bind('dp-positive', 'input', _updatePreview);
    _bind('dp-negative', 'input', _updatePreview);

    // iframe 프리뷰 동기화
    ['dp-bg','dp-text','dp-accent','dp-positive','dp-negative','dp-warning',
     'dp-rank1','dp-rank2','dp-rank3','dp-bodyFont','dp-titleFont','dp-quoteFont',
     'dp-headlineAccent','dp-headlineBase','dp-itemText','dp-sourceText',
     'dp-chartTitle','dp-quoteText','dp-cardRadius','dp-gap','dp-itemsGap',
     'dp-badgeSize','dp-barHeight','dp-maxContent','dp-mapTheme',
     'dp-subKeyword','dp-subStroke','dp-subStrokeW','dp-subSize','dp-subBottom',
     'v-circleBadge','v-iconBadge','v-imageBadge','v-flagBadge','v-logoBadge',
     'v-rankBadge','v-card','v-metricCard','v-comparisonCell','v-callout',
     'v-tag','v-pill','v-statusDot','v-progressBar','v-miniBar',
     'v-connector','v-timelineDot','v-stepBadge','v-quoteMark','v-divider',
     'v-glowDot','v-annotationLine','v-sparkline'
    ].forEach(function(id) {
      _bind(id, 'input', function() { _sendToPreview(); _autoSaveToProject(); });
      _bind(id, 'change', function() { _sendToPreview(); _autoSaveToProject(); });
    });

    _sendToPreview();
  }

  function _bind(id, evt, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener(evt, fn);
  }

  function _updatePreview() {
    var accent = _v('dp-accent') || _v('g-accent') || '#F59E0B';
    var theme = _v('g-theme') || 'dark';
    var mood = _v('d-mood') || 'informative';
    var bg = _v('dp-bg') || (theme === 'white' ? '#FAFAFA' : '#0A0A0A');
    var fg = theme === 'white' ? '#1A1A2E' : '#fff';
    var pos = _v('dp-positive') || '#22C55E';
    var neg = _v('dp-negative') || '#EF4444';
    var el = document.getElementById('preview-grid');
    if (el) {
      el.innerHTML = ''
        + '<div class="preview-chip"><div class="preview-swatch" style="background:' + bg + ';display:flex;align-items:center;justify-content:center;font-size:10px;color:' + fg + '">' + _esc(theme) + '</div>배경</div>'
        + '<div class="preview-chip"><div class="preview-swatch" style="background:' + accent + '"></div>액센트<div class="preview-chip-label">' + _esc(accent) + '</div></div>'
        + '<div class="preview-chip"><div class="preview-swatch" style="background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:10px">' + _esc(mood) + '</div>무드</div>'
        + '<div class="preview-chip"><div class="preview-swatch" style="background:' + pos + '"></div>Positive</div>'
        + '<div class="preview-chip"><div class="preview-swatch" style="background:' + neg + '"></div>Negative</div>'
        + '<div class="preview-chip"><div class="preview-swatch" style="background:' + bg + ';border:2px solid ' + accent + ';border-radius:' + (_v('dp-cardRadius') || '12') + 'px;display:flex;align-items:center;justify-content:center;font-size:9px;color:' + fg + '">Card</div>카드</div>';
    }
    _sendToPreview();
  }

  var THEME_DEFAULTS = {
    dark: { bg:'#0A0A0A', text:'#FFFFFF', textMuted:'#FFFFFF', textDim:'#FFFFFF', accent:'#F59E0B', positive:'#22C55E', negative:'#EF4444', warning:'#F59E0B', divider:'rgba(255,255,255,0.08)' },
    white: { bg:'#FAFAFA', text:'#1A1A2E', textMuted:'#4A4A5A', textDim:'#6A6A7A', accent:'#2563EB', positive:'#16A34A', negative:'#DC2626', warning:'#D97706', divider:'rgba(0,0,0,0.06)' },
  };

  function _applyThemeDefaults(theme) {
    var d = THEME_DEFAULTS[theme] || THEME_DEFAULTS.dark;
    var fields = { 'dp-bg': d.bg, 'dp-text': d.text, 'dp-accent': d.accent, 'dp-positive': d.positive, 'dp-negative': d.negative, 'dp-warning': d.warning };
    for (var id in fields) {
      var el = document.getElementById(id);
      if (el) el.value = fields[id];
    }
  }

  function _sendToPreview() {
    var iframe = document.getElementById('preview-iframe');
    if (!iframe || !iframe.contentWindow) return;
    var form = _collectForm();
    iframe.contentWindow.postMessage({ type: 'preset-update', preset: form.designPreset || {} }, '*');
  }

  // 프로젝트의 meta.designPreset에 자동 저장 (디바운스)
  var _saveTimer = null;
  function _autoSaveToProject() {
    if (_saveTimer) clearTimeout(_saveTimer);
    _saveTimer = setTimeout(function() {
      var form = _collectForm();
      var dp = form.designPreset || {};
      fetch('/api/p/' + SLUG + '/save-design-preset', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ designPreset: dp, videoTheme: form.global.videoTheme, artStyle: form.global.artStyle })
      }).catch(function() {});
    }, 1000); // 1초 디바운스
  }

  // 내장 프리셋 복제
  function _forkBuiltin(p) {
    _activeId = null;
    _renderPresetList();
    _renderEditor({
      _id: null, name: p.name + ' (커스텀)', description: p.description, builtin: false,
      global: JSON.parse(JSON.stringify(p.global || {})),
      defaults: JSON.parse(JSON.stringify(p.defaults || {})),
      animation: JSON.parse(JSON.stringify(p.animation || {})),
      designPreset: JSON.parse(JSON.stringify(p.designPreset || {})),
    });
  }

  // ── 폼 헬퍼 ──
  function _fmtInput(id, label, val, disabled, cls) {
    return '<div class="form-group' + (cls ? ' ' + cls : '') + '">'
      + '<span class="form-label">' + label + '</span>'
      + '<input class="form-input" id="' + id + '" value="' + _esc(String(val)) + '"' + (disabled ? ' readonly' : '') + '>'
      + '</div>';
  }
  function _fmtSelect(id, label, val, opts, disabled) {
    var h = '<div class="form-group"><span class="form-label">' + label + '</span>'
      + '<select class="form-select" id="' + id + '"' + (disabled ? ' disabled' : '') + '>';
    opts.forEach(function(o) {
      h += '<option value="' + o[0] + '"' + (o[0] === val ? ' selected' : '') + '>' + o[1] + '</option>';
    });
    return h + '</select></div>';
  }
  function _fmtColor(id, label, val, disabled) {
    // <input type="color">는 #rrggbb 형식만 허용 — transparent 등 비표준값 폴백
    var colorVal = (val && /^#[0-9a-fA-F]{6}$/.test(val)) ? val : '#000000';
    return '<div class="form-group"><span class="form-label">' + label + '</span>'
      + '<input class="form-input" type="color" id="' + id + '" value="' + _esc(colorVal) + '"' + (disabled ? ' disabled' : '') + '>'
      + '</div>';
  }
  function _fmtRange(id, label, val, min, max, step, disabled) {
    return '<div class="form-group"><span class="form-label">' + label + ' <b id="' + id + '-val">' + val + '</b></span>'
      + '<input class="form-input" type="range" id="' + id + '" value="' + val + '" min="' + min + '" max="' + max + '" step="' + step + '"'
      + (disabled ? ' disabled' : '') + '>'
      + '</div>';
  }

  // range 값 표시 — 이벤트 위임
  document.addEventListener('input', function(e) {
    if (e.target.type === 'range') {
      var lbl = document.getElementById(e.target.id + '-val');
      if (lbl) lbl.textContent = e.target.value;
    }
  });

  // ── 폼 수집 ──
  function _collectForm() {
    var titleFont = _v('dp-titleFont');
    var theme = _v('g-theme') || 'dark';
    var td = THEME_DEFAULTS[theme] || THEME_DEFAULTS.dark;
    return {
      name: _v('preset-name'),
      description: _v('preset-desc'),
      global: { videoTheme: theme, artStyle: _v('g-artStyle'), accentColor: _v('g-accent'), vizFont: _v('g-font') },
      defaults: { mood: _v('d-mood'), reveal: _v('d-reveal'), emphasis: _v('d-emphasis'), layout: _v('d-layout') },
      animation: { stagger: parseInt(_v('a-stagger')), itemDuration: parseInt(_v('a-itemDur')), easing: _v('a-easing'), titleFadeIn: parseInt(_v('a-titleFade')) },
      designPreset: {
        baseTheme: theme,
        colors: {
          bg: _v('dp-bg') || td.bg,
          text: _v('dp-text') || td.text,
          accent: _v('dp-accent') || td.accent,
          positive: _v('dp-positive') || td.positive,
          negative: _v('dp-negative') || td.negative,
          warning: _v('dp-warning') || td.warning,
          rank: [_v('dp-rank1') || '#FFD700', _v('dp-rank2') || '#C0C0C0', _v('dp-rank3') || '#CD7F32'],
        },
        fonts: {
          body: { family: _v('dp-bodyFont') || 'Pretendard' },
          title: titleFont ? { family: titleFont } : undefined,
          quote: { family: _v('dp-quoteFont') || 'Georgia, serif' },
        },
        typography: {
          headlineAccent: parseInt(_v('dp-headlineAccent')) || 80,
          headlineBase: parseInt(_v('dp-headlineBase')) || 48,
          itemText: parseInt(_v('dp-itemText')) || 28,
          sourceText: parseInt(_v('dp-sourceText')) || 18,
          chartTitle: parseInt(_v('dp-chartTitle')) || 48,
          quoteText: parseInt(_v('dp-quoteText')) || 44,
        },
        layout: {
          cardRadius: parseInt(_v('dp-cardRadius')) || 12,
          gap: parseInt(_v('dp-gap')) || 24,
          itemsGap: parseInt(_v('dp-itemsGap')) || 16,
          badgeSize: parseInt(_v('dp-badgeSize')) || 48,
          barHeight: parseInt(_v('dp-barHeight')) || 32,
          maxContentWidth: parseInt(_v('dp-maxContent')) || 1100,
        },
        map: { defaultTheme: _v('dp-mapTheme') || 'modern_clean' },
        subtitle: {
          keywordColor: _v('dp-subKeyword') || '#F7D94C',
          strokeColor: _v('dp-subStroke') || '#3D3B2F',
          strokeWidth: parseFloat(_v('dp-subStrokeW')) || 2,
          fontSize: parseInt(_v('dp-subSize')) || 44,
          bottomOffset: parseInt(_v('dp-subBottom')) || 30,
        },
        variants: {
          circleBadge: _v('v-circleBadge') || 'circle',
          iconBadge: _v('v-iconBadge') || 'circle',
          imageBadge: _v('v-imageBadge') || 'circle',
          flagBadge: _v('v-flagBadge') || 'circle',
          logoBadge: _v('v-logoBadge') || 'circle',
          rankBadge: _v('v-rankBadge') || 'circle',
          card: _v('v-card') || 'bordered',
          metricCard: _v('v-metricCard') || 'bordered',
          comparisonCell: _v('v-comparisonCell') || 'bordered',
          callout: _v('v-callout') || 'left-border',
          tag: _v('v-tag') || 'rounded',
          pill: _v('v-pill') || 'pill',
          statusDot: _v('v-statusDot') || 'dot',
          progressBar: _v('v-progressBar') || 'rounded',
          miniBar: _v('v-miniBar') || 'rounded',
          connector: _v('v-connector') || 'arrow',
          timelineDot: _v('v-timelineDot') || 'circle',
          stepBadge: _v('v-stepBadge') || 'circle',
          quoteMark: _v('v-quoteMark') || 'large',
          divider: _v('v-divider') || 'solid',
          glowDot: _v('v-glowDot') || 'glow',
          annotationLine: _v('v-annotationLine') || 'solid',
          sparkline: _v('v-sparkline') || 'line',
        },
      },
    };
  }

  // ── 저장 ──
  window.savePreset = function() {
    var data = _collectForm();
    if (!data.name) { _showStatus('이름을 입력하세요', true); return; }
    var method = _activeId ? 'PUT' : 'POST';
    var url = _activeId ? '/api/design-presets/' + _activeId : '/api/design-presets';
    fetch(url, { method: method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.ok) {
          _showStatus('저장 완료');
          if (res._id) _activeId = res._id;
          window.loadPresets();
        } else { _showStatus(res.error || '저장 실패', true); }
      })
      .catch(function(e) { _showStatus('오류: ' + e.message, true); });
  };

  // ── 삭제 ──
  window.deletePreset = function(id) {
    akConfirm('프리셋을 삭제하시겠습니까?', function () { _deletePresetRun(id); });
  };

  function _deletePresetRun(id) {
    fetch('/api/design-presets/' + id, { method: 'DELETE' })
      .then(function(r) { return r.json(); })
      .then(function() {
        _activeId = null;
        var area = document.getElementById('editor-area');
        if (area) area.innerHTML = '<div class="editor-placeholder"><div class="placeholder-icon">🎨</div><p>프리셋을 선택하세요</p></div>';
        window.loadPresets();
      });
  };

  // ── 프로젝트에 적용 ──
  window.applyPreset = function(id) {
    if (!id) { _showStatus('먼저 프리셋을 저장하세요', true); return; }
    // 「확인/취소」에 서로 다른 뜻을 담던 자리다. 앱에서 confirm이 죽으면
    // 언제나 「빈 값만」으로 흘러가 버리므로 물음을 나눈다.
    akConfirm('모든 씬에 덮어씁니다.\n\n취소하면 빈 값만 채웁니다.',
      function () { _applyPresetRun(true); });
  };

  function _applyPresetRun(applyAll) {
    fetch('/api/p/' + SLUG + '/apply-preset', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ preset_id: id, apply_all: applyAll })
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.ok) { _showStatus(res.scenes_updated + '개 씬에 적용 완료'); }
      else { _showStatus(res.error || '적용 실패', true); }
    })
    .catch(function(e) { _showStatus('오류: ' + e.message, true); });
  };

  function _showStatus(msg, isErr) {
    var el = document.getElementById('design-status');
    if (el) {
      el.className = 'status-msg ' + (isErr ? 'status-err' : 'status-ok');
      el.textContent = msg;
      setTimeout(function() { el.textContent = ''; }, 3000);
    }
  }

  // ── 프로젝트 현재 디자인 프리셋 로드 ──
  function _loadProjectPreset() {
    fetch('/api/p/' + SLUG + '/manifest-meta')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var meta = data.meta || {};
        var dp = meta.designPreset;
        if (dp && Object.keys(dp).length > 0) {
          // 프로젝트에 적용된 designPreset이 있으면 "현재 프로젝트" 가상 프리셋으로 에디터 표시
          _renderEditor({
            _id: null,
            name: '현재 프로젝트 설정',
            description: '프로젝트에 적용된 디자인 프리셋',
            builtin: false,
            global: {
              videoTheme: meta.videoTheme || dp.baseTheme || 'dark',
              artStyle: meta.artStyle || '',
              accentColor: (dp.colors && dp.colors.accent) || '#F59E0B',
              vizFont: meta.vizFont || 'Pretendard',
            },
            defaults: {},
            animation: dp.animation || {},
            designPreset: dp,
          });
        }
      })
      .catch(function() { /* manifest 없으면 무시 */ });
  }

  // 초기 로드
  window.loadPresets();
  _loadProjectPreset();
})();
</script>

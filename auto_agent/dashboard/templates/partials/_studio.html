<!-- Studio 탭 — Remotion Studio + 자막 사이드 패널 -->
<div class="studio-container" id="studio-container">
  <!-- 상단 툴바 -->
  <div class="studio-toolbar">
    <div class="studio-status" id="studio-status">
      <span class="status-dot" id="studio-dot"></span>
      <span id="studio-status-text">프로젝트 설정 중...</span>
    </div>
    <div class="studio-actions">
      <span style="font-size:11px;color:var(--text-muted)">S</span>
      <input type="number" id="scene-num-input" min="1" value="1"
        style="width:44px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;
        color:var(--text);font-size:13px;font-weight:700;padding:2px 6px;text-align:center;outline:none;">
      <button class="btn btn-sm btn-accent" id="btn-edit">편집</button>
      <a class="btn btn-sm" id="studio-open-btn" target="_blank" style="display:none;">새 창</a>
    </div>
  </div>

  <!-- Remotion Studio iframe + 자막 사이드 패널 -->
  <div class="studio-frame-wrapper" id="studio-frame-wrapper" style="display:none;">
    <iframe id="studio-iframe" src="about:blank" class="studio-iframe" allow="autoplay"></iframe>
    <div class="studio-subtitle-side" id="studio-subtitle-side">
      <div class="subtitle-side-header">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="subtitle-side-title">자막</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <span id="subtitle-save-status" style="font-size:11px;"></span>
            <button class="btn btn-sm btn-accent" id="btn-subtitle-save">저장</button>
          </div>
        </div>
        <span class="subtitle-hint">Enter: 분리 &nbsp;|&nbsp; Backspace(줄 처음): 병합</span>
      </div>
      <div id="studio-subtitle-panel" class="studio-subtitle-panel"></div>
    </div>
  </div>

  <div class="studio-placeholder" id="studio-placeholder">
    <div class="studio-placeholder-icon">&#9654;</div>
    <h3>Remotion Studio</h3>
    <p>매니페스트를 빌드하고 Studio를 시작합니다...</p>
  </div>
</div>

        <button class="btn-icon" id="modal-prev" title="이전 씬">&#8249;</button>

<script>
// ── SubtitleEditor ──────────────────────────────────
var SubtitleEditor = (function() {
  var _slug = '', _sceneNum = 0, _words = [], _entries = [];
  var _panel = null, _saveBtn = null, _saveStatus = null, _onSaved = null;

  function fmtTime(sec) {
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = Math.floor(sec % 60);
    var ms = Math.round((sec % 1) * 1000);
    return (h < 10 ? '0' : '') + h + ':' +
           (m < 10 ? '0' : '') + m + ':' +
           (s < 10 ? '0' : '') + s + ',' +
           (ms < 100 ? (ms < 10 ? '00' : '0') : '') + ms;
  }

  function findSplitTiming(blockText, cursorOffset, blockStartSec, blockEndSec) {
    var blockWords = _words.filter(function(w) {
      return w.start >= blockStartSec - 0.01 && w.end <= blockEndSec + 0.01;
    });
    if (!blockWords.length) {
      var ratio = cursorOffset / (blockText.length || 1);
      var splitSec = blockStartSec + (blockEndSec - blockStartSec) * ratio;
      return { firstEnd: Math.round(splitSec * 1000) / 1000, secondStart: Math.round(splitSec * 1000) / 1000 };
    }
    var textBefore = blockText.substring(0, cursorOffset).trim();
    var accumulated = '';
    var bestEnd = blockStartSec;
    for (var i = 0; i < blockWords.length; i++) {
      accumulated += (accumulated ? ' ' : '') + blockWords[i].word;
      if (accumulated.length >= textBefore.length) {
        bestEnd = blockWords[i].end;
        // secondStart = firstEnd (갭 없이 바로 이어붙임)
        return { firstEnd: Math.round(bestEnd * 1000) / 1000, secondStart: Math.round(bestEnd * 1000) / 1000 };
      }
      bestEnd = blockWords[i].end;
    }
    return { firstEnd: blockEndSec, secondStart: blockEndSec };
  }

  function renderBlocks() {
    if (!_panel) return;
    _panel.innerHTML = '';
    if (!_entries.length) {
      _panel.innerHTML = '<div class="subtitle-empty">자막 없음<br>TTS 생성 후 자막을 먼저 생성하세요.</div>';
      return;
    }
    _entries.forEach(function(entry, idx) {
      var block = document.createElement('div');
      block.className = 'srt-block';
      block.dataset.idx = idx;

      var tc = document.createElement('div');
      tc.className = 'srt-timecode';
      tc.textContent = fmtTime(entry.startSec) + '\n→ ' + fmtTime(entry.endSec);

      var txt = document.createElement('div');
      txt.className = 'srt-text';
      txt.contentEditable = 'true';
      txt.spellcheck = false;
      txt.textContent = entry.text;

      txt.addEventListener('input', function() {
        _entries[idx].text = txt.textContent || '';
      });

      // Enter → 분리
      txt.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var sel = window.getSelection();
        if (!sel || !sel.rangeCount) return;
        var range = sel.getRangeAt(0);
        var preRange = document.createRange();
        preRange.setStart(txt, 0);
        preRange.setEnd(range.startContainer, range.startOffset);
        var cursorOffset = preRange.toString().length;

        var entry = _entries[idx];
        var timing = findSplitTiming(entry.text, cursorOffset, entry.startSec, entry.endSec);
        var textBefore = entry.text.substring(0, cursorOffset).trim();
        var textAfter = entry.text.substring(cursorOffset).trim();
        if (!textBefore || !textAfter) return;

        var newEntry = { index: 0, startSec: timing.secondStart, endSec: entry.endSec, text: textAfter };
        _entries[idx] = { index: 0, startSec: entry.startSec, endSec: timing.firstEnd, text: textBefore };
        _entries.splice(idx + 1, 0, newEntry);
        _entries.forEach(function(e, i) { e.index = i + 1; });
        renderBlocks();
        setTimeout(function() {
          var nextTxt = _panel.querySelectorAll('.srt-text')[idx + 1];
          if (nextTxt) {
            nextTxt.focus();
            var r = document.createRange();
            r.setStart(nextTxt.firstChild || nextTxt, 0);
            r.collapse(true);
            var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          }
        }, 0);
      });

      // Backspace at start → 병합
      txt.addEventListener('keydown', function(e) {
        if (e.key !== 'Backspace' || idx === 0) return;
        var sel = window.getSelection();
        if (!sel || !sel.rangeCount) return;
        var range = sel.getRangeAt(0);
        var preRange = document.createRange();
        preRange.setStart(txt, 0);
        preRange.setEnd(range.startContainer, range.startOffset);
        if (preRange.toString().length !== 0) return;
        e.preventDefault();
        var prev = _entries[idx - 1];
        var curr = _entries[idx];
        var prevOrigLen = prev.text.length;
        prev.text = (prev.text + ' ' + curr.text).trim();
        prev.endSec = curr.endSec;
        _entries.splice(idx, 1);
        _entries.forEach(function(e, i) { e.index = i + 1; });
        renderBlocks();
        setTimeout(function() {
          var prevTxt = _panel.querySelectorAll('.srt-text')[idx - 1];
          if (prevTxt && prevTxt.firstChild) {
            var r = document.createRange();
            r.setStart(prevTxt.firstChild, Math.min(prevOrigLen, prevTxt.firstChild.length));
            r.collapse(true);
            var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          }
        }, 0);
      });

      block.appendChild(tc);
      block.appendChild(txt);
      _panel.appendChild(block);
    });
  }

  function load(slug, sceneNum, panel, saveBtn, saveStatus, onSaved) {
    _slug = slug;
    _sceneNum = sceneNum;
    _panel = panel;
    _saveBtn = saveBtn;
    _saveStatus = saveStatus;
    _onSaved = onSaved || null;

    panel.innerHTML = '<div class="subtitle-empty">로딩 중...</div>';
    if (saveStatus) saveStatus.textContent = '';

    fetch('/api/p/' + slug + '/subtitles/' + sceneNum)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        _entries = data.entries || [];
        _words = data.words || [];
        renderBlocks();
      })
      .catch(function() {
        panel.innerHTML = '<div class="subtitle-empty">로딩 실패</div>';
      });
  }

  function save() {
    if (!_saveBtn) return;
    _saveBtn.disabled = true;
    _saveBtn.textContent = '저장 중...';
    if (_saveStatus) _saveStatus.textContent = '';
    fetch('/api/p/' + _slug + '/subtitles/' + _sceneNum, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entries: _entries })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      _saveBtn.disabled = false;
      _saveBtn.textContent = '저장';
      if (_saveStatus) {
        _saveStatus.className = 'subtitle-save-ok';
        _saveStatus.textContent = '✓ 저장됨';
        setTimeout(function() { if (_saveStatus) _saveStatus.textContent = ''; }, 2000);
      }
      if (_onSaved) _onSaved();
    })
    .catch(function() {
      _saveBtn.disabled = false;
      _saveBtn.textContent = '저장';
      if (_saveStatus) {
        _saveStatus.className = 'subtitle-save-err';
        _saveStatus.textContent = '✗ 실패';
        setTimeout(function() { if (_saveStatus) _saveStatus.textContent = ''; }, 3000);
      }
    });
  }

  return { load: load, save: save };
})();
// ── SubtitleEditor END ──────────────────────────────

(function() {
  var SLUG = '{{ slug }}';
  var DIR_NAME = '{{ dir_name|default(slug) }}';
  var _studioPort = null;
  var _scenes = [];
  var _meta = null;
  var _currentIdx = 0;
  var _checkTimer = null;
  var _dirty = false;

  // DOM refs
  var elDot = document.getElementById('studio-dot');
  var elStatusText = document.getElementById('studio-status-text');
  var elOpenBtn = document.getElementById('studio-open-btn');
  var elPlaceholder = document.getElementById('studio-placeholder');
  var elFrameWrapper = document.getElementById('studio-frame-wrapper');
  var elIframe = document.getElementById('studio-iframe');
  var elEdit = document.getElementById('btn-edit');
  var elNumInput = document.getElementById('scene-num-input');
  var elOverlay = document.getElementById('edit-modal-overlay');
  var elModalTitle = document.getElementById('edit-modal-title');
  var elRoot = document.getElementById('scene-editor-root');
  var elModalPrev = document.getElementById('modal-prev');
  var elModalNext = document.getElementById('modal-next');
  var elCloseModal = document.getElementById('btn-close-modal');
  var elSubtitlePanel = document.getElementById('studio-subtitle-panel');
  var elSubtitleSaveBtn = document.getElementById('btn-subtitle-save');
  var elSubtitleSaveStatus = document.getElementById('subtitle-save-status');

  // ── 자막 로드 (씬 번호 기준) ──
  function loadSubtitlePanel(sceneNum) {
    SubtitleEditor.load(SLUG, sceneNum, elSubtitlePanel, elSubtitleSaveBtn, elSubtitleSaveStatus, function() {
      // 저장 성공 후 iframe 새로고침 (매니페스트 리빌드 반영)
      if (elIframe && elIframe.src && elIframe.src !== 'about:blank') {
        elIframe.src = elIframe.src;
      }
    });
  }

  elSubtitleSaveBtn.addEventListener('click', function() { SubtitleEditor.save(); });

  // ── Studio 상태 ──
  function updateStudioUI(data) {
    _studioPort = data.port;
    if (data.running) {
      elDot.className = 'status-dot running';
      elStatusText.textContent = 'Studio 실행 중 (port ' + data.port + ')';
      elOpenBtn.style.display = '';
      elOpenBtn.href = 'http://localhost:' + data.port;
      elPlaceholder.style.display = 'none';
      elFrameWrapper.style.display = '';
      if (elIframe.src === 'about:blank') elIframe.src = 'http://localhost:' + data.port;
      if (!_checkTimer) _checkTimer = setInterval(checkStatus, 15000);
      // Studio 준비 완료 → 자막 패널 초기 로드
      loadSubtitlePanel(parseInt(elNumInput.value) || 1);
    } else {
      elDot.className = 'status-dot stopped';
      elStatusText.textContent = '중지됨';
      elOpenBtn.style.display = 'none';
    }
  }

  function checkStatus() {
    fetch('/api/studio/status').then(function(r) { return r.json(); }).then(updateStudioUI).catch(function() {});
  }

  function autoStart() {
    elStatusText.textContent = '매니페스트 빌드 중...';
    fetch('/api/studio/setup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({slug: SLUG}) })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.running) {
        var baseUrl = 'http://localhost:' + (data.port || _studioPort);
        elIframe.src = baseUrl + '?t=' + Date.now();
        updateStudioUI({running: true, port: data.port || _studioPort});
      } else {
        elStatusText.textContent = 'Studio 시작 중...';
        fetch('/api/studio/start', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({slug: SLUG}) })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.ok) { setTimeout(checkStatus, 3000); _checkTimer = setInterval(checkStatus, 3000); }
          else { elStatusText.textContent = 'Studio 시작 실패'; }
        });
      }
    })
    .catch(function() { checkStatus(); });
  }

  // ── 씬 목록 ──
  function loadScenes() {
    fetch('/api/p/' + SLUG + '/editor/manifest-meta')
      .then(function(r) { return r.json(); })
      .then(function(data) { _meta = data.meta || null; })
      .catch(function() {});

    fetch('/api/p/' + SLUG + '/editor/scene-list')
      .then(function(r) { return r.json(); })
      .then(function(data) { _scenes = data.scenes || []; })
      .catch(function() {});
  }

  function findIdxByNum(num) {
    for (var i = 0; i < _scenes.length; i++) {
      if ((_scenes[i].sceneNumber || (i+1)) === num) return i;
    }
    return -1;
  }

  function editByNum() {
    var num = parseInt(elNumInput.value);
    if (!num || num < 1) return;
    var idx = findIdxByNum(num);
    if (idx >= 0) { openModal(idx); }
    else { openModal(Math.min(num - 1, _scenes.length - 1)); }
  }

  function updateNav() {
    elModalPrev.disabled = _currentIdx <= 0;
    elModalNext.disabled = _currentIdx >= _scenes.length - 1;
    var num = (_scenes[_currentIdx] || {}).sceneNumber || (_currentIdx + 1);
    elNumInput.value = num;
  }

  // ── 모달 열기/닫기 ──
  function openModal(idx) {
    if (idx < 0 || idx >= _scenes.length) return;
    _currentIdx = idx;
    _dirty = false;
    updateNav();

    var s = _scenes[idx];
    var num = s.sceneNumber || (idx + 1);
    var icon = s.hasMap ? '🌐 ' : '';
    elModalTitle.textContent = icon + 'Scene ' + num + (s.title ? ' — ' + s.title.replace(/\{\{|\}\}/g, '').substring(0, 40) : '');

    if (window.unmountSceneEditor) window.unmountSceneEditor();
    if (window._mapEditorDestroy) { window._mapEditorDestroy(); window._mapEditorDestroy = null; }
    elRoot.innerHTML = '<div style="padding:40px;text-align:center;color:#888">로딩 중...</div>';

    fetch('/api/p/' + SLUG + '/editor/scenes/' + num)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.scene) return;
        if (data.scene.mapScene && data.scene.mapScene.mapType) {
          if (window.renderMapEditor) {
            window.renderMapEditor(elRoot, data.scene, num, SLUG, _meta);
          } else {
            elRoot.innerHTML = '<div style="padding:40px;text-align:center;color:#888">map-editor.js 로딩 중...</div>';
            setTimeout(function() {
              if (window.renderMapEditor) window.renderMapEditor(elRoot, data.scene, num, SLUG, _meta);
            }, 1000);
          }
        } else {
          window.__SCENE_EDITOR_DATA__ = {
            scene: data.scene,
            meta: _meta || { fps: 30, resolution: { width: 1920, height: 1080 }, subtitleFont: 'Pretendard', vizFont: 'Pretendard' },
            slug: SLUG,
          };
          if (window.mountSceneEditor) window.mountSceneEditor(elRoot);
        }
      });

    elOverlay.classList.add('open');
  }

  function closeModal() {
    elOverlay.classList.remove('open');
    if (window.unmountSceneEditor) window.unmountSceneEditor();
    if (window._mapEditorDestroy) { window._mapEditorDestroy(); window._mapEditorDestroy = null; }

    if (_dirty) {
      elStatusText.textContent = '매니페스트 재빌드 중...';
      fetch('/api/p/' + SLUG + '/rebuild-manifest', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function() {
          elStatusText.textContent = 'Studio 새로고침 중...';
          loadScenes();
          setTimeout(function() {
            if (elIframe.src !== 'about:blank') elIframe.src = elIframe.src;
            setTimeout(function() { elStatusText.textContent = 'Studio 실행 중 (port ' + _studioPort + ')'; }, 2000);
          }, 1000);
        });
    }
  }

  function modalNav(delta) {
    var newIdx = _currentIdx + delta;
    if (newIdx >= 0 && newIdx < _scenes.length) openModal(newIdx);
  }

  document.addEventListener('scene-editor-saved', function() {
    _dirty = true;
    loadScenes();
  });

  // ── 이벤트 바인딩 ──
  elEdit.addEventListener('click', editByNum);

  // 씬 번호 변경 → 자막 패널도 갱신
  elNumInput.addEventListener('change', function() {
    var num = parseInt(elNumInput.value);
    if (num && num > 0) loadSubtitlePanel(num);
  });
  elNumInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') editByNum();
  });

  elModalPrev.addEventListener('click', function() { modalNav(-1); });
  elModalNext.addEventListener('click', function() { modalNav(1); });
  elCloseModal.addEventListener('click', closeModal);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && elOverlay.classList.contains('open')) { closeModal(); return; }
    if (elOverlay.classList.contains('open')) return;
  });

  elOverlay.addEventListener('click', function(e) { if (e.target === elOverlay) closeModal(); });

  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'remotion-scene' && e.data.sceneNumber) {
      var num = e.data.sceneNumber;
      elNumInput.value = num;
      loadSubtitlePanel(num);
    }
  });

  // ── 초기화 ──
  autoStart();
  loadScenes();
})();
</script>

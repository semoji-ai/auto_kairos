<!-- Assets 탭 — 이미지 에셋 (후보 썸네일 + 교체) -->
<div class="assets-page">
  <div class="assets-header">
    <h2>Image Assets</h2>
    <div class="assets-stats" id="assets-stats"></div>
  </div>
  <div class="assets-list" id="assets-list">
    <div class="assets-loading">로드 중...</div>
  </div>
</div>

<style>
.assets-page { padding: 16px 20px; }
.assets-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.assets-header h2 { margin: 0; font-size: 16px; }
.assets-stats { display: flex; gap: 8px; font-size: 11px; color: var(--text-muted); }
.assets-stats .stat-badge { padding: 3px 10px; border-radius: 10px; background: rgba(255,255,255,0.06); }

.assets-list { display: flex; flex-direction: column; gap: 16px; }
.assets-loading { text-align: center; color: var(--text-muted); padding: 40px; }

.asset-row {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; overflow: hidden;
}
.asset-row:hover { border-color: rgba(255,255,255,0.12); }

.asset-main { display: flex; gap: 16px; padding: 12px; align-items: flex-start; }

.asset-img-area {
  width: 320px; flex-shrink: 0; border-radius: 8px; overflow: hidden;
  background: #0a0a0a; position: relative; cursor: pointer;
}
.asset-img-area img { width: 100%; display: block; }
.asset-img-area .no-img {
  width: 100%; height: 180px; display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.1); font-size: 48px;
}
.asset-img-area .badge-tl {
  position: absolute; top: 6px; left: 6px;
  font-size: 10px; padding: 2px 8px; border-radius: 6px; font-weight: 600;
}
.asset-img-area .badge-tr {
  position: absolute; top: 6px; right: 6px;
  font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 700;
  background: rgba(0,0,0,0.7); color: #fff;
}
.type-search { background: rgba(59,130,246,0.85); color: #fff; }
.type-gen { background: rgba(168,85,247,0.85); color: #fff; }
.type-none { background: rgba(239,68,68,0.7); color: #fff; }

.asset-info { flex: 1; min-width: 0; }
.asset-title { font-size: 13px; font-weight: 600; color: #E4E4E7; margin-bottom: 4px; }
.asset-layout { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.06); color: var(--text-muted); display: inline-block; }
.asset-detail { font-size: 11px; color: #9CA3AF; line-height: 1.6; margin-top: 6px; }
.asset-detail strong { color: #D4D4D8; }

.btn-candidates {
  margin-top: 8px; padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 600;
  background: rgba(59,130,246,0.15); color: #60A5FA; border: 1px solid rgba(59,130,246,0.3);
  cursor: pointer;
}
.btn-candidates:hover { background: rgba(59,130,246,0.25); }

/* 후보 패널 */
.candidates-panel { padding: 8px 12px; border-top: 1px solid rgba(255,255,255,0.06); display: none; }
.candidates-panel.open { display: block; }
.candidates-panel .loading { font-size: 10px; color: var(--text-muted); padding: 8px; }
.candidates-grid {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 0;
}
.candidate-thumb {
  width: 120px; height: 68px; flex-shrink: 0; border-radius: 6px; overflow: hidden;
  cursor: pointer; border: 2px solid transparent; position: relative;
  background: #111;
}
.candidate-thumb:hover { border-color: rgba(59,130,246,0.5); }
.candidate-thumb.selected { border-color: #22C55E; }
.candidate-thumb img { width: 100%; height: 100%; object-fit: cover; }
.candidate-thumb .c-license {
  position: absolute; bottom: 2px; right: 2px; font-size: 7px; padding: 1px 3px;
  background: rgba(0,0,0,0.7); color: #9CA3AF; border-radius: 2px;
}
</style>

<script>
(function() {
  var list = document.getElementById('assets-list');
  var statsEl = document.getElementById('assets-stats');
  var slug = '{{ slug }}';

  fetch('/api/p/' + encodeURIComponent(slug) + '/scenes')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var scenes = data.scenes || [];
      if (!scenes.length) { list.innerHTML = '<div class="assets-loading">씬 없음</div>'; return; }

      var total = scenes.length, imgOk = 0, imgQuery = 0, genCount = 0;
      scenes.forEach(function(s) {
        if (s._image_url) imgOk++;
        if ((s.imageAsset || {}).query) imgQuery++;
        if ((s.imageAsset || {}).source === 'generate') genCount++;
      });
      statsEl.innerHTML =
        '<span class="stat-badge">' + total + '씬</span>' +
        '<span class="stat-badge">✅ ' + imgOk + '/' + imgQuery + '</span>' +
        '<span class="stat-badge">🎨 생성 ' + genCount + '</span>';

      list.innerHTML = '';
      scenes.forEach(function(s) {
        var num = s.sceneNumber;
        var img = s.imageAsset || {};
        var imgUrl = s._image_url || '';
        var source = img.source || '';
        var query = img.query || '';
        var layout = ((s.visualization || {}).creative || {}).layout || '';
        var mood = ((s.visualization || {}).creative || {}).mood || '';
        var placement = img.placement || '';
        var opacity = img.opacity || '';

        var typeClass = (source === 'wikimedia' || source === 'search') ? 'type-search' :
                        source === 'generate' ? 'type-gen' : 'type-none';
        var typeText = (source === 'wikimedia' || source === 'search') ? '🔍 검색' :
                       source === 'generate' ? '🎨 생성' : '—';

        var row = document.createElement('div');
        row.className = 'asset-row';
        row.innerHTML =
          '<div class="asset-main">' +
            '<div class="asset-img-area">' +
              (imgUrl ? '<img src="' + imgUrl + '" loading="lazy" id="img-' + num + '">' : '<div class="no-img">🖼️</div>') +
              '<span class="badge-tl ' + typeClass + '">' + typeText + '</span>' +
              '<span class="badge-tr">S' + String(num).padStart(2,'0') + '</span>' +
            '</div>' +
            '<div class="asset-info">' +
              '<div class="asset-title">' + esc(s.title || '') + '</div>' +
              (layout ? '<span class="asset-layout">' + esc(layout) + (mood ? ' · ' + mood : '') + '</span>' : '') +
              '<div class="asset-detail">' +
                (query ? '<div><strong>쿼리:</strong> ' + esc(query) + '</div>' : '') +
                (placement ? '<div><strong>배치:</strong> ' + placement + (opacity ? ' · opacity ' + opacity : '') + '</div>' : '') +
              '</div>' +
              (query ? '<button class="btn-candidates" onclick="loadCandidates(' + num + ',this)">🔍 후보 이미지 보기</button>' : '') +
            '</div>' +
          '</div>' +
          '<div class="candidates-panel" id="candidates-' + num + '">' +
            '<div class="loading">후보 로드 중...</div>' +
          '</div>';
        list.appendChild(row);
      });
    });

  window.loadCandidates = function(sceneNum, btn) {
    var panel = document.getElementById('candidates-' + sceneNum);
    if (panel.classList.contains('open')) {
      panel.classList.remove('open');
      btn.textContent = '🔍 후보 이미지 보기';
      return;
    }
    panel.classList.add('open');
    btn.textContent = '접기';
    panel.innerHTML = '<div class="loading">위키미디어 검색 중...</div>';

    fetch('/api/p/' + encodeURIComponent(slug) + '/images/candidates/' + sceneNum)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var candidates = data.candidates || [];
        if (!candidates.length) {
          panel.innerHTML = '<div class="loading">검색 결과 없음</div>';
          return;
        }
        var html = '<div class="candidates-grid">';
        candidates.forEach(function(c, i) {
          var thumb = c.thumbnail_url || '';
          var title = c.title || '';
          var license = c.license || '';
          var origUrl = c.original_url || '';
          html += '<div class="candidate-thumb" onclick="selectCandidate(' + sceneNum + ',\'' + esc(origUrl) + '\')" title="' + esc(title) + '">'
            + (thumb ? '<img src="' + thumb + '" loading="lazy">' : '')
            + '<span class="c-license">' + esc(license) + '</span>'
            + '</div>';
        });
        html += '</div>';
        panel.innerHTML = html;
      })
      .catch(function(e) {
        panel.innerHTML = '<div class="loading">에러: ' + e.message + '</div>';
      });
  };

  window.selectCandidate = function(sceneNum, url) {
    if (!confirm('이 이미지로 교체할까요?')) return;
    fetch('/api/p/' + encodeURIComponent(slug) + '/images/select/' + sceneNum, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: url}),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        var imgEl = document.getElementById('img-' + sceneNum);
        if (imgEl) imgEl.src = '/output/' + slug + '/images/scene_' + String(sceneNum).padStart(3,'0') + '.jpg?t=' + Date.now();
        alert('교체 완료!');
      } else {
        alert('실패: ' + (data.error || ''));
      }
    });
  };

  function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
})();
</script>

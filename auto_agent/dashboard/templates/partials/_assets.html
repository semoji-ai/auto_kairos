<!-- Assets 탭 — 이미지 에셋 (후보 썸네일 + 교체) -->
<div class="assets-page">
  <div class="assets-header">
    <h2>Image Assets</h2>
    <div class="assets-stats" id="assets-stats"></div>
  </div>
  <div class="art-style-bar" id="art-style-bar"></div>
  <div class="assets-list" id="assets-list">
    <div class="assets-loading">로드 중...</div>
  </div>
</div>

<style>
.assets-page { padding: 16px 20px; }
.assets-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.assets-header h2 { margin: 0; font-size: 16px; }
.assets-stats { display: flex; gap: 8px; font-size: 11px; color: var(--text-muted); }
.assets-stats .stat-badge { padding: 3px 10px; border-radius: 10px; background: rgba(255,255,255,0.06); }

.art-style-bar {
  display: flex; align-items: center; gap: 12px; padding: 8px 12px; margin-bottom: 12px;
  background: rgba(168,85,247,0.06); border: 1px solid rgba(168,85,247,0.15);
  border-radius: 8px; font-size: 11px;
}
.art-style-bar .style-label { color: #C084FC; font-weight: 600; }
.art-style-bar .style-name { color: #E4E4E7; }
.art-style-bar .style-ref { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; }
.art-style-bar select { padding: 3px 8px; border-radius: 4px; background: rgba(0,0,0,0.3); color: #E4E4E7; border: 1px solid rgba(255,255,255,0.1); font-size: 10px; }

.assets-list { display: flex; flex-direction: column; gap: 16px; }
.assets-loading { text-align: center; color: var(--text-muted); padding: 40px; }

.asset-row {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; overflow: hidden;
}
.asset-row:hover { border-color: rgba(255,255,255,0.12); }

.asset-main { display: flex; gap: 16px; padding: 12px; align-items: flex-start; }

.asset-img-area {
  width: 320px; flex-shrink: 0; border-radius: 8px; overflow: hidden;
  background: #0a0a0a; position: relative; cursor: pointer;
}
.asset-img-area img { width: 100%; display: block; }
.asset-img-area .no-img {
  width: 100%; height: 180px; display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.1); font-size: 48px;
}
.asset-img-area .badge-tl {
  position: absolute; top: 6px; left: 6px;
  font-size: 10px; padding: 2px 8px; border-radius: 6px; font-weight: 600;
}
.asset-img-area .badge-tr {
  position: absolute; top: 6px; right: 6px;
  font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 700;
  background: rgba(0,0,0,0.7); color: #fff;
}
.type-search { background: rgba(59,130,246,0.85); color: #fff; }
.type-gen { background: rgba(168,85,247,0.85); color: #fff; }
.type-none { background: rgba(239,68,68,0.7); color: #fff; }

.asset-info { flex: 1; min-width: 0; }
.asset-title { font-size: 13px; font-weight: 600; color: #E4E4E7; margin-bottom: 4px; }
.asset-layout { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.06); color: var(--text-muted); display: inline-block; }
.asset-detail { font-size: 11px; color: #9CA3AF; line-height: 1.6; margin-top: 6px; }
.asset-detail strong { color: #D4D4D8; }

.btn-candidates {
  margin-top: 8px; padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 600;
  background: rgba(59,130,246,0.15); color: #60A5FA; border: 1px solid rgba(59,130,246,0.3);
  cursor: pointer;
}
.btn-candidates:hover { background: rgba(59,130,246,0.25); }

/* 후보 패널 */
.candidates-panel { padding: 8px 12px; border-top: 1px solid rgba(255,255,255,0.06); display: none; }
.candidates-panel.open { display: block; }
.candidates-panel .loading { font-size: 10px; color: var(--text-muted); padding: 8px; }
.candidates-grid {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 0;
}
.candidate-thumb {
  width: 120px; height: 68px; flex-shrink: 0; border-radius: 6px; overflow: hidden;
  cursor: pointer; border: 2px solid transparent; position: relative;
  background: #111;
}
.candidate-thumb:hover { border-color: rgba(59,130,246,0.5); }
.candidate-thumb.selected { border-color: #22C55E; }
.candidate-thumb img { width: 100%; height: 100%; object-fit: cover; }
.candidate-thumb .c-license {
  position: absolute; bottom: 2px; right: 2px; font-size: 7px; padding: 1px 3px;
  background: rgba(0,0,0,0.7); color: #9CA3AF; border-radius: 2px;
}

/* 생성 패널 */
.generate-panel { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.06); display: none; }
.generate-panel.open { display: block; }
.gen-prompt-area { width: 100%; min-height: 60px; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #E4E4E7; font-size: 11px; font-family: inherit; resize: vertical; }
.gen-controls { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.gen-mode { font-size: 10px; display: flex; gap: 8px; }
.gen-mode label { display: flex; align-items: center; gap: 3px; color: var(--text-muted); cursor: pointer; }
.gen-mode input { margin: 0; }
.btn-generate { padding: 5px 14px; border-radius: 6px; font-size: 11px; font-weight: 600; background: rgba(168,85,247,0.2); color: #C084FC; border: 1px solid rgba(168,85,247,0.3); cursor: pointer; }
.btn-generate:hover { background: rgba(168,85,247,0.35); }
.btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-auto-prompt { padding: 4px 10px; border-radius: 5px; font-size: 10px; background: rgba(59,130,246,0.15); color: #60A5FA; border: 1px solid rgba(59,130,246,0.2); cursor: pointer; }
.gen-status { font-size: 10px; color: var(--text-muted); margin-top: 6px; }
.gen-result img { max-width: 320px; border-radius: 6px; margin-top: 8px; }
.btn-gen-toggle { padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 600; background: rgba(168,85,247,0.15); color: #C084FC; border: 1px solid rgba(168,85,247,0.3); cursor: pointer; margin-left: 4px; }
.btn-gen-toggle:hover { background: rgba(168,85,247,0.25); }

/* 히스토리 */
.history-panel { padding: 6px 12px; border-top: 1px solid rgba(255,255,255,0.04); }
.history-panel:empty { display: none; padding: 0; border: 0; }
.history-label { font-size: 9px; color: var(--text-muted); margin-bottom: 4px; }
.history-thumbs { display: flex; gap: 6px; overflow-x: auto; }
.history-thumb {
  width: 80px; height: 45px; flex-shrink: 0; border-radius: 4px; overflow: hidden;
  cursor: pointer; border: 1px solid rgba(255,255,255,0.08); opacity: 0.7;
}
.history-thumb:hover { opacity: 1; border-color: rgba(59,130,246,0.5); }
.history-thumb img { width: 100%; height: 100%; object-fit: cover; }
</style>

<script>
(function() {
  var list = document.getElementById('assets-list');
  var statsEl = document.getElementById('assets-stats');
  var slug = '{{ slug }}';
  var dirName = '{{ dir_name|default(slug) }}';

  // 아트스타일 로드
  fetch('/api/p/' + encodeURIComponent(slug) + '/art-style')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var bar = document.getElementById('art-style-bar');
      var current = data.current_info || {};
      var styles = data.available || [];
      var options = styles.map(function(s) {
        var sel = s.path === data.current ? ' selected' : '';
        return '<option value="' + s.path + '"' + sel + '>' + esc(s.name) + '</option>';
      }).join('');
      bar.innerHTML =
        '<span class="style-label">🎨 아트스타일</span>' +
        '<select onchange="changeArtStyle(this.value)">' + options + '</select>' +
        '<span class="style-name">' + esc(current.name || '미설정') + '</span>';
    }).catch(function() {});

  // 씬 로드
  fetch('/api/p/' + encodeURIComponent(slug) + '/scenes')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var scenes = data.scenes || [];
      if (!scenes.length) { list.innerHTML = '<div class="assets-loading">씬 없음</div>'; return; }

      var total = scenes.length, imgOk = 0, imgQuery = 0, genCount = 0;
      scenes.forEach(function(s) {
        if (s._image_url) imgOk++;
        if ((s.imageAsset || {}).prompt || (s.imageAsset || {}).query) imgQuery++;
        if ((s.imageAsset || {}).source === 'generate') genCount++;
      });
      statsEl.innerHTML =
        '<span class="stat-badge">' + total + '씬</span>' +
        '<span class="stat-badge">✅ ' + imgOk + '/' + imgQuery + '</span>' +
        '<span class="stat-badge">🎨 생성 ' + genCount + '</span>';

      list.innerHTML = '';
      // 버전 목록 로드
      function loadVersions(sceneNum) {
        fetch('/api/p/' + encodeURIComponent(slug) + '/images/versions/' + sceneNum)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var panel = document.getElementById('history-' + sceneNum);
            var versions = data.versions || [];
            var selected = data.selected || '';
            if (versions.length <= 1) { panel.innerHTML = ''; return; }
            var html = '<div class="history-label">버전 (' + versions.length + ')</div><div class="history-thumbs">';
            versions.forEach(function(v) {
              var isSel = v.file === selected;
              var typeIcon = v.type === 'generate' ? '🎨' : '🔍';
              html += '<div class="history-thumb' + (isSel ? ' selected' : '') + '" '
                + 'onclick="selectVersion(' + sceneNum + ',\'' + esc(v.file) + '\')" '
                + 'title="' + typeIcon + ' ' + esc(v.file) + '">'
                + '<img src="' + v.url + '" loading="lazy">'
                + '</div>';
            });
            html += '</div>';
            panel.innerHTML = html;
          }).catch(function() {});
      }

      scenes.forEach(function(s) {
        var num = s.sceneNumber;
        var img = s.imageAsset || {};
        var imgUrl = s._image_url || '';
        var source = img.source || '';
        var query = img.prompt || img.query || '';
        var layout = s.layout || ((s.visualization || {}).creative || {}).layout || '';
        var mood = s.mood || ((s.visualization || {}).creative || {}).mood || '';
        var placement = img.placement || '';
        var opacity = img.opacity || '';

        var typeClass = (source === 'wikimedia' || source === 'search') ? 'type-search' :
                        source === 'generate' ? 'type-gen' : 'type-none';
        var typeText = (source === 'wikimedia' || source === 'search') ? '🔍 검색' :
                       source === 'generate' ? '🎨 생성' : '—';

        var row = document.createElement('div');
        row.className = 'asset-row';
        row.innerHTML =
          '<div class="asset-main">' +
            '<div class="asset-img-area">' +
              (imgUrl ? '<img src="' + imgUrl + '" loading="lazy" id="img-' + num + '">' : '<div class="no-img">🖼️</div>') +
              '<span class="badge-tl ' + typeClass + '">' + typeText + '</span>' +
              '<span class="badge-tr">S' + String(num).padStart(2,'0') + '</span>' +
            '</div>' +
            '<div class="asset-info">' +
              '<div class="asset-title">' + esc(s.title || '') + '</div>' +
              (layout ? '<span class="asset-layout">' + esc(layout) + (mood ? ' · ' + mood : '') + '</span>' : '') +
              '<div class="asset-detail">' +
                (query ? '<div><strong>쿼리:</strong> ' + esc(query) + '</div>' : '') +
                (placement ? '<div><strong>배치:</strong> ' + placement + (opacity ? ' · opacity ' + opacity : '') + '</div>' : '') +
              '</div>' +
              '<button class="btn-candidates" onclick="loadCandidates(' + num + ',this)">🔍 후보 검색</button>' +
              '<button class="btn-gen-toggle" onclick="toggleGenerate(' + num + ',this)">🎨 이미지 생성</button>' +
            '</div>' +
          '</div>' +
          '<div class="candidates-panel" id="candidates-' + num + '">' +
            '<div class="loading">후보 로드 중...</div>' +
          '</div>' +
          '<div class="history-panel" id="history-' + num + '"></div>' +
          '<div class="generate-panel" id="generate-' + num + '">' +
            '<textarea class="gen-prompt-area" id="gen-prompt-' + num + '" placeholder="이미지 프롬프트를 입력하세요..."></textarea>' +
            '<div class="gen-controls">' +
              '<button class="btn-auto-prompt" onclick="autoPrompt(' + num + ')">✨ 자동 프롬프트</button>' +
              '<div class="gen-mode">' +
                '<label><input type="radio" name="mode-' + num + '" value="scene" checked> scene</label>' +
                '<label><input type="radio" name="mode-' + num + '" value="scene-flat"> flat</label>' +
              '</div>' +
              '<button class="btn-generate" id="gen-btn-' + num + '" onclick="generateImage(' + num + ')">🎨 생성하기</button>' +
            '</div>' +
            '<div class="gen-status" id="gen-status-' + num + '"></div>' +
          '</div>';
        list.appendChild(row);
        // 버전 목록 자동 로드
        loadVersions(num);
      });
    });

  window.loadCandidates = function(sceneNum, btn) {
    var panel = document.getElementById('candidates-' + sceneNum);
    if (panel.classList.contains('open')) {
      panel.classList.remove('open');
      btn.textContent = '🔍 후보 검색';
      return;
    }
    panel.classList.add('open');
    btn.textContent = '접기';

    // 검색 UI 렌더링
    panel.innerHTML =
      '<div class="search-bar" style="display:flex;gap:6px;margin-bottom:8px;align-items:center">' +
        '<input type="text" id="search-q-' + sceneNum + '" placeholder="검색어 입력 (빈칸=자동)" style="flex:1;padding:4px 8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#E4E4E7;font-size:12px">' +
        '<select id="search-src-' + sceneNum + '" style="padding:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#E4E4E7;font-size:11px">' +
          '<option value="wikimedia">위키미디어</option>' +
          '<option value="serper">Serper (Google)</option>' +
        '</select>' +
        '<button onclick="doSearch(' + sceneNum + ')" style="padding:4px 10px;background:var(--accent);border:none;border-radius:4px;color:#000;font-size:11px;font-weight:600;cursor:pointer">검색</button>' +
      '</div>' +
      '<div id="search-results-' + sceneNum + '"></div>';
    // 자동 검색 (캐시 또는 기본 쿼리)
    doSearch(sceneNum);
  };

  window.doSearch = function(sceneNum) {
    var q = (document.getElementById('search-q-' + sceneNum) || {}).value || '';
    var src = (document.getElementById('search-src-' + sceneNum) || {}).value || 'wikimedia';
    var results = document.getElementById('search-results-' + sceneNum);
    results.innerHTML = '<div class="loading">' + (src === 'serper' ? 'Google' : '위키미디어') + ' 검색 중...</div>';

    var url = '/api/p/' + encodeURIComponent(slug) + '/images/candidates/' + sceneNum + '?source=' + src;
    if (q) url += '&q=' + encodeURIComponent(q);

    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var candidates = data.candidates || [];
        var queryUsed = data.query || '';
        if (queryUsed && !q) {
          var input = document.getElementById('search-q-' + sceneNum);
          if (input) input.placeholder = queryUsed;
        }
        if (!candidates.length) {
          results.innerHTML = '<div class="loading">검색 결과 없음 (쿼리: ' + esc(queryUsed) + ')</div>';
          return;
        }
        var html = '<div class="candidates-grid">';
        candidates.forEach(function(c, i) {
          var thumb = c.thumbnail_url || c.imageUrl || '';
          var title = c.title || '';
          var license = c.license || '';
          var origUrl = c.original_url || c.imageUrl || '';
          html += '<div class="candidate-thumb" onclick="selectCandidate(' + sceneNum + ',\'' + esc(origUrl) + '\')" title="' + esc(title) + '">'
            + (thumb ? '<img src="' + thumb + '" loading="lazy">' : '')
            + '<span class="c-license">' + esc(license || src) + '</span>'
            + '</div>';
        });
        html += '</div>';
        results.innerHTML = html;
      })
      .catch(function(e) {
        results.innerHTML = '<div class="loading">에러: ' + e.message + '</div>';
      });
  };

  window.selectCandidate = function(sceneNum, url) {
    if (!confirm('이 이미지로 교체할까요?')) return;
    fetch('/api/p/' + encodeURIComponent(slug) + '/images/select/' + sceneNum, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: url}),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        var imgEl = document.getElementById('img-' + sceneNum);
        if (imgEl) imgEl.src = '/output/' + dirName + '/images/scene_' + String(sceneNum).padStart(3,'0') + '.jpg?t=' + Date.now();
        alert('교체 완료!');
      } else {
        alert('실패: ' + (data.error || ''));
      }
    });
  };

  window.selectVersion = function(sceneNum, fileName) {
    fetch('/api/p/' + encodeURIComponent(slug) + '/images/select/' + sceneNum, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ file: fileName }),
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        // 메인 이미지를 scene_NNN 복사본으로 갱신 (ext 추론)
        var ext = fileName.split('.').pop();
        var imgEl = document.getElementById('img-' + sceneNum);
        if (imgEl) {
          imgEl.src = '/output/' + dirName + '/images/scene_' + String(sceneNum).padStart(3,'0') + '.' + ext + '?t=' + Date.now();
        }
        loadVersions(sceneNum);
      } else {
        alert('실패: ' + (d.error || ''));
      }
    });
  };

  window.changeArtStyle = function(path) {
    fetch('/api/p/' + encodeURIComponent(slug) + '/art-style', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ art_style: path }),
    })
    .then(function(r) { return r.json(); })
    .then(function(d) { if (d.ok) location.reload(); });
  };

  window.toggleGenerate = function(sceneNum, btn) {
    var panel = document.getElementById('generate-' + sceneNum);
    if (panel.classList.contains('open')) {
      panel.classList.remove('open');
      btn.textContent = '🎨 이미지 생성';
    } else {
      panel.classList.add('open');
      btn.textContent = '접기';
    }
  };

  window.autoPrompt = function(sceneNum) {
    var textarea = document.getElementById('gen-prompt-' + sceneNum);
    var status = document.getElementById('gen-status-' + sceneNum);
    status.textContent = '프롬프트 생성 중...';
    textarea.value = '';

    fetch('/api/p/' + encodeURIComponent(slug) + '/images/auto-prompt/' + sceneNum, { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.prompt) {
          textarea.value = data.prompt;
          status.textContent = '프롬프트 생성 완료';
        } else {
          status.textContent = '실패: ' + (data.error || '');
        }
      })
      .catch(function(e) { status.textContent = '에러: ' + e.message; });
  };

  window.generateImage = function(sceneNum) {
    var textarea = document.getElementById('gen-prompt-' + sceneNum);
    var status = document.getElementById('gen-status-' + sceneNum);
    var btn = document.getElementById('gen-btn-' + sceneNum);
    var prompt = textarea.value.trim();
    if (!prompt) { status.textContent = '프롬프트를 입력하세요'; return; }

    var mode = 'scene';
    var radios = document.querySelectorAll('input[name="mode-' + sceneNum + '"]');
    radios.forEach(function(r) { if (r.checked) mode = r.value; });

    btn.disabled = true;
    status.innerHTML = '🎨 생성 중... (30초~2분 소요) <span class="spinner"></span>';

    fetch('/api/p/' + encodeURIComponent(slug) + '/images/generate/' + sceneNum, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ prompt: prompt, mode: mode }),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      btn.disabled = false;
      if (data.ok) {
        status.textContent = '✅ 생성 완료!';
        var imgEl = document.getElementById('img-' + sceneNum);
        if (imgEl) imgEl.src = '/output/' + dirName + '/images/scene_' + String(sceneNum).padStart(3,'0') + '.png?t=' + Date.now();
        loadVersions(sceneNum);
      } else {
        status.textContent = '실패: ' + (data.error || '').substring(0, 100);
      }
    })
    .catch(function(e) { btn.disabled = false; status.textContent = '에러: ' + e.message; });
  };

  function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
})();
</script>

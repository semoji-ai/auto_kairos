[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-agent"
version = "2.0.0"
description = "AI 영상 제작 파이프라인 CLI"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
dashboard = ["fastapi", "uvicorn", "jinja2"]

[project.scripts]
auto-agent = "auto_agent.cli:main"

[tool.setuptools.packages.find]
include = ["auto_agent*"]

[tool.setuptools.package-data]
auto_agent = [
    "data/**/*.json",
    "data/**/*.md",
    "data/**/*.txt",
    "remotion_template/**/*",
    "db/schema.sql",
]

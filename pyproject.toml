[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-kairos"
version = "3.1.0"
description = "AI Video Production Pipeline — 리서치부터 렌더링까지 자동화"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.52",
    "requests>=2.31",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "questionary>=2.0",
    "Pillow>=10.0",
    "mutagen>=1.47",
    "fal-client>=0.4",
    "elevenlabs>=1.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
]

[project.optional-dependencies]
dashboard = ["fastapi<1.0", "uvicorn", "jinja2", "python-multipart", "websockets"]
subtitle = ["whisperx", "matplotlib"]
sync = ["supabase>=2.0"]
rag = ["sentence-transformers>=2.7", "chromadb>=0.5"]
agents = [
    # 로컬 에이전트 — pip install -e 로 설치 필요
    # pip install -e /Users/jleavens_macmini/Projects/fontagent
    # pip install -e /Users/jleavens_macmini/Projects/chartagent/src
]
all = [
    "fastapi<1.0", "uvicorn", "jinja2", "python-multipart", "websockets",
    "whisperx", "matplotlib",
]

[project.scripts]
auto-kairos = "auto_agent.cli:main"
auto-agent = "auto_agent.cli:main"

[tool.setuptools.packages.find]
include = ["auto_agent*"]
exclude = ["auto_agent.remotion_template.out*", "auto_agent.remotion_template.output*", "auto_agent.remotion_template.test*"]

[tool.setuptools.exclude-package-data]
auto_agent = [
    "remotion_template/out/**/*",
    "remotion_template/output/**/*",
    "remotion_template/test/**/*",
    "remotion_template/test_output/**/*",
    "remotion_template/test_props/**/*",
    "remotion_template/public/assets/**/*",
    "remotion_template/public/map_frames/**/*",
    "remotion_template/public/project",
]

[tool.setuptools.package-data]
auto_agent = [
    "data/**/*.json",
    "data/**/*.md",
    "data/**/*.txt",
    "data/**/*.template",
    "data/artstyle/styles/*.jpg",
    "data/artstyle/styles/*.png",
    "remotion_template/src/**/*",
    "remotion_template/public/fonts/*",
    "remotion_template/public/geojson/*",
    "remotion_template/package.json",
    "remotion_template/package-lock.json",
    "remotion_template/tsconfig.json",
    "remotion_template/remotion.config.ts",
    "remotion_template/tailwind.config.ts",
    "remotion_template/postcss.config.js",
    "remotion_template/public/overlays/**/*.json",
    "remotion_template/render_scene.js",
    "db/schema.sql",
    "dashboard/templates/**/*",
    "dashboard/static/**/*",
]
